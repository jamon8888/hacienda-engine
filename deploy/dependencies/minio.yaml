# MinIO / S3 Dependency - Use S3 / GCS / MinIO Operator

# Option 1: Cloud S3 (Recommended for Production)
# AWS S3 / GCS / Azure Blob Storage
# Configure bucket, IAM, CRR via Terraform

# Option 2: MinIO Operator (Self-managed on K8s - Dev/Staging)
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: hacienda-minio
  namespace: storage
spec:
  image: minio/minio:RELEASE.2024-01-16T16-07-38Z
  pools:
    - name: pool-1
      servers: 4
      volumesPerServer: 4
      size: 100Gi
  configuration:
    name: hacienda-minio-config
  certConfig:
    name: hacienda-minio-certs
  requestAutoCert: true
  tenants:
    - name: hacienda
      configuration:
        name: hacienda-minio-tenant-config
  resources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 2000m
---
# Bucket and IAM config (apply after tenant created)
apiVersion: v1
kind: ConfigMap
metadata:
  name: hacienda-minio-buckets
  namespace: storage
data:
  buckets: |
    hacienda-prod:
      versioning: true
      lifecycle:
        - expiration: 365
          noncurrentVersionExpiration: 90
      cors:
        - allowedOrigins: ["https://hacienda.example.com"]
          allowedMethods: ["GET", "PUT", "POST", "DELETE"]
          allowedHeaders: ["*"]
          maxAgeSeconds: 3600
    hacienda-staging:
      versioning: true
      lifecycle:
        - expiration: 30
          noncurrentVersionExpiration: 7
---
apiVersion: v1
kind: Secret
metadata:
  name: hacienda-minio-credentials
  namespace: storage
type: Opaque
stringData:
  accesskey: REPLACE_WITH_VAULT
  secretkey: REPLACE_WITH_VAULT

apiVersion: v1
kind: Secret
metadata:
  name: hacienda-secrets
  namespace: hacienda-prod
  labels:
    app: hacienda-api
type: Opaque
stringData:
  # These values are PLACEHOLDERS - actual values injected by ExternalSecrets Operator
  # DO NOT commit real secrets to git
  database-url: "postgresql://user:pass@hacienda-postgres:5432/hacienda?sslmode=require"
  pseudonym-active-key: "REPLACE_WITH_VAULT_INJECTED_KEY"
  redis-url: "redis://:password@hacienda-redis:6379"
  s3-access-key: "REPLACE_WITH_VAULT_INJECTED_KEY"
  s3-secret-key: "REPLACE_WITH_VAULT_INJECTED_KEY"
  jwt-secret: "REPLACE_WITH_VAULT_INJECTED_KEY"
  fpe-key: "REPLACE_WITH_VAULT_INJECTED_KEY"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hacienda-secrets
  namespace: hacienda-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hacienda-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: hacienda/prod/database
        property: url
    - secretKey: pseudonym-active-key
      remoteRef:
        key: hacienda/prod/pseudonym
        property: active_key
    - secretKey: redis-url
      remoteRef:
        key: hacienda/prod/redis
        property: url
    - secretKey: s3-access-key
      remoteRef:
        key: hacienda/prod/s3
        property: access_key
    - secretKey: s3-secret-key
      remoteRef:
        key: hacienda/prod/s3
        property: secret_key
    - secretKey: jwt-secret
      remoteRef:
        key: hacienda/prod/auth
        property: jwt_secret
    - secretKey: fpe-key
      remoteRef:
        key: hacienda/prod/pseudonym
        property: fpe_key

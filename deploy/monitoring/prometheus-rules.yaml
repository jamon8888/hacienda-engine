apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hacienda-api
  namespace: hacienda-prod
  labels:
    release: prometheus
spec:
  groups:
    - name: hacienda-api.rules
      rules:
        # Availability
        - alert: HaciendaAPIDown
          expr: up{job="hacienda-api"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "hacienda-api is down"
            description: "hacienda-api has been down for more than 1 minute"
            runbook_url: "https://github.com/jamon8888/hacienda-engine/blob/main/docs/saas-production/runbooks/api-down.md"

        # Latency
        - alert: HaciendaAPIHighLatency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="hacienda-api"}[5m])) > 1
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "hacienda-api p95 latency > 1s"
            description: "p95 latency is {{ $value }}s for the last 5 minutes"

        - alert: HaciendaAPICriticalLatency
          expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job="hacienda-api"}[5m])) > 5
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "hacienda-api p99 latency > 5s"
            description: "p99 latency is {{ $value }}s for the last 5 minutes"

        # Error Rate - aggregate both operands with sum
        - alert: HaciendaAPIHighErrorRate
          expr: sum(rate(http_requests_total{job="hacienda-api",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="hacienda-api"}[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "hacienda-api 5xx error rate > 1%"
            description: "5xx error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

        # Resource Usage
        - alert: HaciendaAPIHighCPU
          expr: sum(rate(container_cpu_usage_seconds_total{pod=~"hacienda-api-.*"}[5m])) / sum(container_spec_cpu_quota{pod=~"hacienda-api-.*"} / container_spec_cpu_period{pod=~"hacienda-api-.*"}) > 0.85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "hacienda-api CPU usage > 85%"

        - alert: HaciendaAPIHighMemory
          expr: container_memory_usage_bytes{pod=~"hacienda-api-.*"} / container_spec_memory_limit_bytes{pod=~"hacienda-api-.*"} > 0.85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "hacienda-api memory usage > 85%"

        # Database
        - alert: PostgresReplicationLag
          expr: pg_replication_lag_seconds > 30
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Postgres replication lag > 30s"

        - alert: PostgresConnectionsHigh
          expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Postgres connections > 80%"

        # Redis
        - alert: RedisMemoryHigh
          expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Redis memory usage > 85%"

        # S3
        - alert: S3ErrorsHigh
          expr: rate(s3_request_errors_total[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "S3 error rate > 5%"

        # Audit Chain
        - alert: AuditChainVerificationFailed
          expr: increase(hacienda_audit_verify_failures_total[1h]) > 0
          for: 0m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Audit chain verification failed"
            runbook_url: "https://github.com/jamon8888/hacienda-engine/blob/main/docs/saas-production/runbooks/audit-chain-corruption.md"

        # Pseudonym Key - use .* to match child paths
        - alert: PseudonymKeyAccessAnomaly
          expr: increase(vault_audit_request_total{path=~"hacienda/pseudonym/.*",operation="read"}[5m]) > 10
          for: 5m
          labels:
            severity: critical
            team: security
          annotations:
            summary: "Anomalous pseudonym key access"
            runbook_url: "https://github.com/jamon8888/hacienda-engine/blob/main/docs/saas-production/runbooks/pseudonym-key-compromise.md"

        # HPA
        - alert: HaciendaAPIHPAAtMax
          expr: kube_hpa_status_desired_replicas{hpa="hacienda-api"} == kube_hpa_spec_max_replicas{hpa="hacienda-api"}
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "hacienda-api HPA at max replicas"
            description: "HPA has been at max replicas ({{ $value }}) for 10 minutes"

        # Queue Lag
        - alert: JobQueueLagHigh
          expr: hacienda_job_queue_lag_seconds > 300
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Job queue lag > 5 minutes"

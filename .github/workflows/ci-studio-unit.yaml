name: CI - Studio Unit Tests

# Run the complete Studio unit suite directly against the committed wasm package. Calling
# Vitest instead of the npm lifecycle script is intentional: `test:unit` first rebuilds
# `hacienda-wasm/pkg` with wasm-pack, while this job validates the browser artifact that is
# actually checked into the repository and served by the Studio deployment.

on:
  push:
    branches: [main]
    paths:
      - "apps/hacienda-studio/**"
      - "crates/hacienda-wasm/pkg/**"
      - "hacienda-core/**"
      - "apps/hacienda-studio/package.json"
      - ".github/workflows/ci-studio-unit.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/hacienda-studio/**"
      - "crates/hacienda-wasm/pkg/**"
      - "hacienda-core/**"
      - "apps/hacienda-studio/package.json"
      - ".github/workflows/ci-studio-unit.yaml"

permissions:
  contents: read

jobs:
  unit:
    name: Vitest (Studio)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/hacienda-studio
    steps:
      # `persist-credentials: false` matches ci-rust.yaml/ci-wasm-freshness.yaml: this job
      # only reads the tree, so leaving a usable token in .git/config for every later step
      # (including `npm install`'s lifecycle scripts) buys nothing.
      #
      # Actions are left on `@v4` tags rather than pinned to SHAs deliberately: every one
      # of the repo's 24 workflow checkouts uses a tag today, and pinning this file alone
      # would leave a single outlier that silently stops receiving upstream patches while
      # the rest keep floating. Pinning is worth doing — repo-wide, in its own change.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run Studio unit tests
        run: npx vitest run --reporter=dot

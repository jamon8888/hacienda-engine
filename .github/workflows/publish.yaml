# Release Pipeline

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (no publish)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_targets: ${{ steps.meta.outputs.release_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Determine which targets to release based on changed files
          targets="python,node,wasm,ffi,go,java,csharp,elixir,dart,kotlin_android,swift,zig,ruby,php,cli"
          echo "release_targets=$targets" >> $GITHUB_OUTPUT

  validate-versions:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xberg-io/actions/install-alef@v1
      - run: alef publish validate --version ${{ needs.prepare.outputs.version }}

  build-bindings:
    needs: [prepare, validate-versions]
    strategy:
      matrix:
        include:
          # Python wheels (maturin)
          - { lang: python, runner: ubuntu-24.04-arm }
          - { lang: python, runner: macos-14 }
          - { lang: python, runner: windows-2022 }

          # Node (NAPI-RS)
          - { lang: node, runner: ubuntu-24.04-arm }
          - { lang: node, runner: macos-14 }
          - { lang: node, runner: windows-2022 }

          # WASM
          - { lang: wasm, runner: ubuntu-24.04-arm }

          # Ruby
          - { lang: ruby, runner: ubuntu-24.04-arm }

          # PHP
          - { lang: php, runner: ubuntu-24.04-arm }

          # Go FFI
          - { lang: go, runner: ubuntu-24.04-arm }

          # C FFI
          - { lang: ffi, runner: ubuntu-24.04-arm }

          # Java
          - { lang: java, runner: ubuntu-24.04-arm }

          # C#
          - { lang: csharp, runner: ubuntu-24.04-arm }
          - { lang: csharp, runner: macos-14 }
          - { lang: csharp, runner: windows-2022 }

          # Elixir
          - { lang: elixir, runner: ubuntu-24.04-arm }

          # Dart
          - { lang: dart, runner: ubuntu-24.04-arm }

          # Kotlin/Android
          - { lang: kotlin_android, runner: ubuntu-24.04-arm }

          # Swift
          - { lang: swift, runner: macos-14 }

          # Zig
          - { lang: zig, runner: ubuntu-24.04-arm }

          # CLI binaries
          - { lang: cli, runner: ubuntu-24.04-arm }
          - { lang: cli, runner: macos-14 }
          - { lang: cli, runner: windows-2022 }

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: nightly
          sccache: true
      - uses: xberg-io/actions/install-alef@v1
      - name: Build binding
        run: alef build --lang ${{ matrix.lang }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: hacienda-${{ matrix.lang }}
          path: build/${{ matrix.lang }}/
          retention-days: 7

  upload-assets:
    needs: [prepare, build-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hacienda-*-artifacts
          path: dist/
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: true
          files: dist/**/*

  publish:
    needs: [prepare, upload-assets]
    strategy:
      matrix:
        registry:
          [
            crates_io,
            pypi,
            npm,
            rubygems,
            maven,
            nuget,
            hex,
            pub_dev,
            packagist,
            homebrew,
          ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xberg-io/actions/install-alef@v1
      - name: Publish to ${{ matrix.registry }}
        run: |
          alef publish ${{ matrix.registry }} --version ${{ needs.prepare.outputs.version }} --dry-run ${{ github.event.inputs.dry_run }}

  finalize:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Finalize GitHub Release
        run: gh release edit ${{ needs.prepare.outputs.tag }} --draft=false
      - name: Discord announcement
        if: ${{ !contains(needs.prepare.outputs.version, 'rc') }}
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
            -d '{"content":"🚀 hacienda ${{ needs.prepare.outputs.version }} released!"}'

name: CI - Rust

# Every dtolnay/rust-toolchain@nightly step below pins `toolchain: nightly-2026-08-06`
# rather than floating to whatever nightly is current on the day a run fires. An
# unpinned nightly channel drifted a new clippy::double_must_use lint in on
# 2026-08-08 that fires on ~38 pre-existing #[async_trait]-decorated trait methods
# across hacienda-core, turning every Rust-touching PR red for a reason unrelated to
# its own diff — 2026-08-06 is the last date verified green against this exact
# workspace (main's last successful ci-rust.yaml run). Re-verify and bump this date
# periodically rather than leaving it pinned forever; don't remove the pin entirely.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here only reads the repo and reports check results — no job needs
# more than that, and the token must not outlive the job as writable
# credentials for anything a later step in the same job might shell out to.
permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-06
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features "ner-candle" -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-06
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features "ner-candle"

  # Enumerating features by hand drifted badly: this matrix spent 7 runners checking
  # "xberg-full", "pii", "compliance", "audit", "review", "glossary" and "dev", none of
  # which have ever existed as cargo features. `cargo hack --each-feature` derives the
  # set from the manifests, so it cannot go stale, and it runs as a single job.
  feature-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-06
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check -p hacienda -p hacienda-core --each-feature --features "ner-candle"
      # hacienda-api/hacienda-rag weren't in this matrix at all before, so their
      # `postgres`/`s3`/`chunking`/`streaming` feature combinations were never
      # checked in isolation. `embeddings`/`rag-embeddings` stay excluded — see
      # the workspace root Cargo.toml's xberg dependency comment and
      # hacienda-api/Cargo.toml's `rag-embeddings` comment: they pull ONNX
      # Runtime, whose accelerator-specific prebuilt binary is not guaranteed
      # available on every host, which is exactly the kind of host-dependent
      # flakiness this matrix must not introduce.
      - run: cargo hack check -p hacienda-api -p hacienda-rag --each-feature --exclude-features "embeddings,rag-embeddings"

  test-bindings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-06
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features "ner-candle" -- --test-threads=1

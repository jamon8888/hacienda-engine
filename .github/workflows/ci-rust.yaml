name: CI - Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features "ner-candle" -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features "ner-candle"

  # Enumerating features by hand drifted badly: this matrix spent 7 runners checking
  # "xberg-full", "pii", "compliance", "audit", "review", "glossary" and "dev", none of
  # which have ever existed as cargo features. `cargo hack --each-feature` derives the
  # set from the manifests, so it cannot go stale, and it runs as a single job.
  feature-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check -p hacienda -p hacienda-core --each-feature --features "ner-candle"
      # hacienda-api/hacienda-rag weren't in this matrix at all before, so their
      # `postgres`/`s3`/`chunking`/`streaming` feature combinations were never
      # checked in isolation. `embeddings`/`rag-embeddings` stay excluded — see
      # the workspace root Cargo.toml's xberg dependency comment and
      # hacienda-api/Cargo.toml's `rag-embeddings` comment: they pull ONNX
      # Runtime, whose accelerator-specific prebuilt binary is not guaranteed
      # available on every host, which is exactly the kind of host-dependent
      # flakiness this matrix must not introduce.
      - run: cargo hack check -p hacienda-api -p hacienda-rag --each-feature --exclude-features "embeddings,rag-embeddings"

  test-bindings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features "ner-candle" -- --test-threads=1

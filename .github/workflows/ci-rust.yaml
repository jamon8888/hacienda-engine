name: CI - Rust

on:
  push:
    branches: [main]
    paths:
      - "hacienda/**"
      - "hacienda-core/**"
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Checkout dependency repos
        id: deps
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/jamon8888/xberg.git ../xberg
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/jamon8888/xberg-pii-ecosystem.git ../xberg-pii-ecosystem
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.deps.outcome == 'success'
      - name: Clippy
        if: steps.deps.outcome == 'success'
        run: cargo clippy -p hacienda -p hacienda-core --all-targets --all-features -- -D warnings
      - name: Test
        if: steps.deps.outcome == 'success'
        run: cargo test -p hacienda -p hacienda-core --all-features
      - name: Feature matrix
        if: steps.deps.outcome == 'success'
        run: |
          for feat in xberg-full pii compliance audit review glossary dev; do
            echo "Checking feature: $feat"
            cargo check -p hacienda -p hacienda-core --features $feat
          done
      - name: Skip notice
        if: steps.deps.outcome != 'success'
        run: echo "::notice::Dependency repos not available - Rust checks skipped. Run locally with task setup."

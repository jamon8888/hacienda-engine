name: CI - Rust

on:
  push:
    branches: [main]
    paths:
      - 'hacienda/**'
      - 'hacienda-core/**'
  pull_request:
    branches: [main]

jobs:
  clippy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  feature-matrix:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        features: [
          "xberg-full",
          "pii",
          "compliance",
          "audit",
          "review",
          "glossary",
          "dev"
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p hacienda -p hacienda-core --features ${{ matrix.features }}

  test-bindings:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features -- --test-threads=1

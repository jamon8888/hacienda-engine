name: CI - Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: nightly
          sccache: true
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - run: task lint

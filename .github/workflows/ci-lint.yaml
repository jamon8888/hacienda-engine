name: CI - Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler \
            libprotobuf-dev

      # Pinned date: see ci-rust.yaml's top-of-file comment for why an unpinned
      # nightly channel broke CI on 2026-08-08.
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-06
          components: rustfmt, clippy

      # Run the focused secrecy-client gate before generic repository linting so
      # token-boundary and clippy failures remain attributable to this surface.
      - name: Verify secrecy-client foundation
        run: bash scripts/ci/rust/run-secrecy-client-gate.sh

      - name: Install rumdl
        run: cargo install rumdl --locked

      - name: Install typos
        run: cargo install typos-cli --locked

      # `.agents/skills` holds Claude Code agent skill definitions, not prose
      # documentation — same category as the already-excluded `superpowers`
      # and `.ai-rulez` directories, and not meant to satisfy a human-prose
      # markdown linter any more than those are. `.github/skills` (added in
      # 8af0998, never added here) is the same category under a different
      # root — vendored skill reference docs (e.g. `impeccable`), not this
      # repo's own prose.
      # Studio is not part of this CI; research notes are working documents,
      # not reviewed prose, so neither is checked by the markdown linter.
      - name: Lint markdown
        # MD013 (line length): long lines are intentional in prose and code blocks.
        # MD076 (blank line between list items): the CHANGELOG uses tight lists with
        # multi-line items by convention; rumdl started enforcing MD076 in 2026-11.
        run: rumdl check . --exclude "superpowers,.ai-rulez,.agents,.github/skills,docs/research,apps/hacienda-studio" -d MD013,MD076

      - name: Check spelling
        run: typos . --config _typos.toml

      - name: Checkout dependency repos
        id: deps
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/xberg-io/xberg.git ../xberg

      - name: Check Rust formatting
        if: steps.deps.outcome == 'success'
        run: cargo fmt --all --check

      - name: Run clippy
        if: steps.deps.outcome == 'success'
        run: cargo clippy --workspace --all-targets --features "ner-candle" -- -D warnings

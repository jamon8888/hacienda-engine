name: CI - Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: nightly
          sccache: true
      - uses: xberg-io/actions/install-task@v1
      - name: Install poly
        run: cargo install poly --locked
      - run: task lint

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

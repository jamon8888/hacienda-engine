name: CI - Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Pinned date: see ci-rust.yaml's top-of-file comment for why an unpinned
      # nightly channel broke CI on 2026-08-08.
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-06
          components: rustfmt, clippy

      - name: Install rumdl
        run: cargo install rumdl --locked

      - name: Install typos
        run: cargo install typos-cli --locked

      # `.agents/skills` holds Claude Code agent skill definitions, not prose
      # documentation — same category as the already-excluded `superpowers`
      # and `.ai-rulez` directories, and not meant to satisfy a human-prose
      # markdown linter any more than those are. `.github/skills` (added in
      # 8af0998, never added here) is the same category under a different
      # root — vendored skill reference docs (e.g. `impeccable`), not this
      # repo's own prose. `vendor/` (this session's candle-{core,transformers}
      # wasm-fix patches and the locally-built xberg-wasm-ner-fix binary) is
      # the same "not our prose" category again: third-party crate READMEs
      # and a wasm-bindgen-generated package README, not hand-authored here.
      # Same reasoning for `apps/hacienda-studio/tests/e2e/fixtures`:
      # PII-detection test fixture content, not documentation — MD041 (first
      # line must be a heading) doesn't apply to it.
      - name: Lint markdown
        run: rumdl check . --exclude "superpowers,.ai-rulez,.agents,.github/skills,vendor,apps/hacienda-studio/tests/e2e/fixtures" -d MD013

      - name: Check spelling
        run: typos . --config _typos.toml

      - name: Checkout dependency repos
        id: deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/jamon8888/xberg.git ../xberg
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/jamon8888/xberg-pii-ecosystem.git ../xberg-pii-ecosystem

      - name: Check Rust formatting
        if: steps.deps.outcome == 'success'
        run: cargo fmt --all --check

      - name: Run clippy
        if: steps.deps.outcome == 'success'
        run: cargo clippy --workspace --all-targets --features "ner-candle" -- -D warnings

      - name: Check Rust docs coverage
        if: steps.deps.outcome == 'success'
        env:
          RUSTDOCFLAGS: -D missing_docs
        run: cargo doc --workspace --features "ner-candle" --no-deps

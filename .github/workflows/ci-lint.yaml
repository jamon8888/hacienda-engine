name: CI - Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      
      - name: Install poly tools
        run: |
          # Install rumdl for markdown linting
          cargo install rumdl --locked
          
          # Install typos for spell checking
          cargo install typos-cli --locked
          
          # Install typos words
          cargo install typos-cli --locked --features words
      
      - name: Lint markdown
        run: rumdl .
      
      - name: Check spelling
        run: typos .
      
      - name: Check typos words
        run: typos --words-file /dev/null --dictionary=extended --dictionary=crate-words .
      
      - name: Check Rust formatting
        run: cargo fmt --all --check
      
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings


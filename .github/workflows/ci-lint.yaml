name: CI - Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install rumdl
        run: cargo install rumdl --locked

      - name: Install typos
        run: cargo install typos-cli --locked

      - name: Lint markdown
        run: rumdl check . --exclude "superpowers,.ai-rulez" -d MD013

      - name: Check spelling
        run: typos . --config _typos.toml

      - name: Checkout dependency repos
        id: deps
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/jamon8888/xberg.git ../xberg
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/jamon8888/xberg-pii-ecosystem.git ../xberg-pii-ecosystem

      - name: Check Rust formatting
        if: steps.deps.outcome == 'success'
        run: cargo fmt -p hacienda -p hacienda-core --check

      - name: Run clippy
        if: steps.deps.outcome == 'success'
        run: cargo clippy -p hacienda -p hacienda-core --all-targets --features "ner-candle" -- -D warnings

name: CI - Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      
      - name: Install rumdl
        run: cargo install rumdl --locked
      
      - name: Install typos
        run: cargo install typos-cli --locked
      
      - name: Lint markdown
        run: rumdl check . --ignore superpowers --disable-rules MD013
      
      - name: Check spelling
        run: typos .
      
      - name: Check Rust formatting
        run: cargo fmt --all --check
      
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

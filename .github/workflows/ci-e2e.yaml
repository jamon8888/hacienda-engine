name: CI - E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'hacienda/**'
      - 'hacienda-core/**'
  pull_request:
    branches: [main]

jobs:
  e2e:
    needs: ci-rust
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        lang: [python, node, ruby, php, go, java, csharp, elixir, wasm, dart, kotlin_android, swift, zig]
    steps:
      - uses: actions/checkout@v4
      - uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: nightly
          sccache: true
      - uses: xberg-io/actions/install-alef@v1
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-poly@v1
      - run: task e2e:lang LANG=${{ matrix.lang }}

  e2e:rust:
    needs: ci-rust
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: nightly
          sccache: true
      - uses: Swatinem/rust-cache@v2
      - run: task test:rust

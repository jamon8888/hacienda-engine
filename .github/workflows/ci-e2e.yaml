name: CI - E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Checkout dependency repos
        id: deps
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/jamon8888/xberg.git ../xberg
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/jamon8888/xberg-pii-ecosystem.git ../xberg-pii-ecosystem
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.deps.outcome == 'success'
      - name: Run E2E tests
        if: steps.deps.outcome == 'success'
        run: cargo test --workspace --features "ner-candle"
      - name: Skip notice
        if: steps.deps.outcome != 'success'
        run: echo "::notice::Dependency repos not available - E2E tests skipped."

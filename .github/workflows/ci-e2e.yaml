name: CI - E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'hacienda/**'
      - 'hacienda-core/**'
  pull_request:
    branches: [main]

jobs:
  e2e:
    needs: ci-rust
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        lang: [python, node, ruby, php, go, java, csharp, elixir, wasm, dart, kotlin_android, swift, zig]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features -- --test-threads=1

  e2e:rust:
    needs: ci-rust
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features -- --test-threads=1

name: CI - E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned date: see ci-rust.yaml's top-of-file comment for why an unpinned
      # nightly channel broke CI on 2026-08-08.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-06
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run E2E tests
        run: cargo test --workspace --features "ner-candle"

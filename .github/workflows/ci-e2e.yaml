name: CI - E2E Tests

on:
  push:
    branches: [main]
    paths:
      - "hacienda/**"
      - "hacienda-core/**"
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jamon8888/xberg
          path: ../xberg
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: jamon8888/xberg-pii-ecosystem
          path: ../xberg-pii-ecosystem
          ref: main
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test -p hacienda -p hacienda-core --all-features

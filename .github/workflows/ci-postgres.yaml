name: CI - Postgres Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Both jobs only read the repo and run tests against a locally-provisioned
# Postgres — no job needs more than that.
permissions:
  contents: read

# sqlx::query!/query_as! verify SQL against a live database at compile time whenever
# DATABASE_URL is set — which postgres-integration-tests does, pointing at a database that
# isn't migrated until the *test binary* runs, not at compile time. Without SQLX_OFFLINE,
# that compile-time verification queries tables that don't exist yet and the build fails
# with cascading type errors. SQLX_OFFLINE forces both jobs to check queries against the
# committed `.sqlx` cache instead, which is what CI should be doing anyway (a stale cache
# entry should fail the build, not silently query a live schema).
env:
  SQLX_OFFLINE: "true"

jobs:
  # hacienda-core's Postgres-backed store tests (audit/jobs/presets/review/
  # usage/versions/api_keys) spin up their own disposable Postgres container
  # via `testcontainers` (see hacienda-core/src/store/postgres/test_support.rs)
  # — no `services:` block needed, just a Docker daemon, which GitHub-hosted
  # runners already provide. They're `#[ignore]`d so a normal `cargo test`
  # skips them; `--test-threads=1` is required (see test_support.rs's doc
  # comment: several suites share one instance and are not safe to
  # interleave).
  #
  # The name filter (`--lib store::postgres`) deliberately excludes this
  # crate's other `#[ignore]`d tests (`audit::store_file`'s sandboxed
  # chmod/timing test, `facade.rs`'s equivalent, `tests/ner_eval.rs`'s
  # model-download test) — none of those are Postgres-related, and running
  # them here would either fail outright under CI's root user or need
  # network access this job has no reason to request.
  postgres-store-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned date: see ci-rust.yaml's top-of-file comment for why an unpinned
      # nightly channel broke CI on 2026-08-08.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-06
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run hacienda-core Postgres store tests
        # Previously 5 of these tests were `--skip`-listed here: they all failed on the
        # *same* corrupted segment_id/hash `SegmentIntegrity` mismatch regardless of what
        # each individually exercised, which turned out to be test-isolation, not a
        # seal-chain bug. Root cause: `should_detect_a_tampered_entry_in_a_sealed_segment`
        # and `should_report_a_missing_entry_as_a_count_mismatch` tamper a row directly
        # via SQL and never restored it, and every test in this suite shares one Postgres
        # instance (see test_support.rs) — so the other three, which call
        # `verify()`/`entries()` (deliberately store-wide, mirroring the single-writer
        # production design), inherited corruption left behind by whichever tamper test
        # ran first alphabetically. Fixed by having both tamper tests restore what they
        # changed before returning (`hacienda-core/src/store/postgres/audit.rs`) — not by
        # narrowing `verify()`'s production scope to dodge the shared state.
        run: |
          cargo test -p hacienda-core --features postgres --lib store::postgres \
            -- --ignored --test-threads=1

  # hacienda-rag's pgvector tests and hacienda-api's routes.rs Postgres-backed
  # route tests read `DATABASE_URL` directly instead of managing their own
  # container, so this job needs a real Postgres service. Two databases in
  # one service container, one per crate: hacienda-core's and hacienda-rag's
  # independently-embedded `sqlx::migrate!` directories reserve disjoint
  # version ranges (0001-0099 vs 0100-0199, see
  # hacienda-core/migrations/README.md) precisely so they *can* share one
  # database — but exercising that shared-database path is
  # `PgVectorStore`'s own `should_run_both_crates_migrations_against_one_shared_database`
  # test, not something this job needs to additionally set up by hand.
  postgres-integration-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned date: see ci-rust.yaml's top-of-file comment for why an unpinned
      # nightly channel broke CI on 2026-08-08.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-06
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create per-crate databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE hacienda_api_test;'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE hacienda_rag_test;'
      - name: Run hacienda-api Postgres-backed route tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hacienda_api_test
        run: |
          cargo test -p hacienda-api --lib routes \
            -- --ignored --test-threads=1 --skip rag_migrate_embeddings_full_round_trip
      - name: Run hacienda-rag pgvector tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hacienda_rag_test
        run: |
          cargo test -p hacienda-rag --features postgres --lib backends::pgvector \
            -- --ignored --test-threads=1

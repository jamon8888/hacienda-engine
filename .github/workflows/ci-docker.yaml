name: CI - Docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "Dockerfile*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "hacienda/**"
      - "hacienda-core/**"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "Dockerfile*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "hacienda/**"
      - "hacienda-core/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfiles
        run: |
          for f in docker/Dockerfile docker/Dockerfile.musl-build docker/Dockerfile.musl-ffi docker/Dockerfile.musl-node docker/Dockerfile.musl-rustler; do
            echo "Validating $f..."
            docker buildx build --check -f "$f" . 2>&1 || true
          done

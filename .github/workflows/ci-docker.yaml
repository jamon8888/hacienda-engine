name: CI - Docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "Dockerfile*"
      - "config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "hacienda/**"
      - "hacienda-core/**"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "Dockerfile*"
      - "config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "hacienda/**"
      - "hacienda-core/**"

jobs:
  # `docker/Dockerfile` is the image the README/docker-compose.yml/docs/configuration.md
  # tell an operator to run, so it gets a real build — not `--check` (a lint pass that
  # never executes a single RUN/COPY) piped into `|| true` (which swallows the exit code
  # regardless). That combination previously meant this job could never fail red no
  # matter how broken the Dockerfile was — it shipped a CMD invoking a CLI subcommand
  # that doesn't exist, a HEALTHCHECK calling a subcommand that doesn't exist, and a
  # COPY of a config file that wasn't in the repo, all silently.
  validate-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docker/Dockerfile
        run: docker buildx build -f docker/Dockerfile -t hacienda:ci-check .
      - name: Smoke-test the image starts and serves /health
        run: |
          # config/production.toml ships a placeholder static auth token
          # (documented as such — replace before deploying). check_bind_policy
          # correctly refuses to bind 0.0.0.0 with that placeholder still in
          # place, so the smoke test needs its own config with a real token.
          smoke_config="$(mktemp)"
          sed "s/replace-me-before-deploying/$(openssl rand -hex 32)/" \
            config/production.toml > "$smoke_config"
          docker run -d --name hacienda-smoke -p 18787:8787 \
            -v "$smoke_config:/app/config/production.toml:ro" \
            hacienda:ci-check
          for i in $(seq 1 10); do
            if curl -sf http://localhost:18787/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::hacienda did not answer /health within 10s"
          docker logs hacienda-smoke
          exit 1

  # The musl/FFI variants are not what the README/docker-compose point at and are not
  # exercised elsewhere, so they stay `--check`-only (a real build for each would add
  # meaningfully to CI time for images nothing currently depends on) — `--check` still
  # catches Dockerfile syntax errors, just not a build failure partway through. Revisit
  # if any of these becomes the image an operator is actually told to run.
  validate-other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate remaining Dockerfiles (syntax check only, see comment above)
        run: |
          for f in docker/Dockerfile.musl-build docker/Dockerfile.musl-ffi docker/Dockerfile.musl-node docker/Dockerfile.musl-rustler; do
            echo "Validating $f..."
            docker buildx build --check -f "$f" .
          done

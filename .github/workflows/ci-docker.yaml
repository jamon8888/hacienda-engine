name: CI - Docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "Dockerfile*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "hacienda/**"
      - "hacienda-core/**"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "Dockerfile*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "hacienda/**"
      - "hacienda-core/**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - docker/Dockerfile
          - docker/Dockerfile.musl-build
          - docker/Dockerfile.musl-ffi
          - docker/Dockerfile.musl-node
          - docker/Dockerfile.musl-rustler
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: hacienda-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test CLI
        run: docker run --rm hacienda-test:latest --help || echo "CLI test skipped (image may not have CLI)"

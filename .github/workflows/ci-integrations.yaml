name: CI Integrations

on:
  push:
    branches: [main]
    paths:
      - "integrations/**"
      - ".github/workflows/ci-integrations.yaml"
  pull_request:
    branches: [main]
    paths:
      - "integrations/**"
      - ".github/workflows/ci-integrations.yaml"
  workflow_dispatch:

concurrency:
  group: ci-integrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python Integrations
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        package:
          - python/langchain
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        working-directory: integrations/${{ matrix.package }}
        run: uv sync --all-extras --prerelease=allow
      - name: Generate SDK
        working-directory: sdks/python
        run: bash scripts/generate.sh
      - name: Test
        working-directory: integrations/${{ matrix.package }}
        run: uv run pytest -q

  node:
    name: Node Integrations
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package:
          - node/langchain
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Build SDK
        run: |
          npm ci
          npm run build --workspace=sdks/typescript
      - name: Install
        working-directory: integrations/${{ matrix.package }}
        run: npm ci
      - name: Test
        working-directory: integrations/${{ matrix.package }}
        run: npm run test:unit

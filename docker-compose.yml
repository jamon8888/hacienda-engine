version: "3.8"

services:
  hacienda:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
      - "8081:8081"
    environment:
      - RUST_LOG=info,hacienda=debug
      - HACIENDA_JWT_SECRET=${HACIENDA_JWT_SECRET}
      - HACIENDA_FPE_KEY=${HACIENDA_FPE_KEY}
      - HACIENDA_MODELS_DIR=/var/lib/hacienda/models
    volumes:
      - hacienda-models:/var/lib/hacienda/models
      - hacienda-audit:/var/log/hacienda
      - ./config/production.toml:/app/config/production.toml:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

  prometheus:
    image: prom/prometheus:v2.47
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  grafana:
    image: grafana/grafana:10.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.26
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager

volumes:
  hacienda-models:
  hacienda-audit:
  prometheus-data:
  grafana-data:
  alertmanager-data:

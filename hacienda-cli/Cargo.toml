[package]
name = "hacienda-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for hacienda — redaction-by-default document extraction"
license.workspace = true

# The binary is `hacienda`, not `hacienda-cli`. The crate name is split off only to keep
# clap out of the library's dependency graph (integration design §4); the name a user
# types should not carry that detail.
[[bin]]
name = "hacienda"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# Config discovery falls back to the platform config directory when no project-local
# hacienda.{toml,yaml,json} is found — see hacienda-cli/src/config.rs. Mirrors
# xberg's own ExtractionConfig::discover().
dirs = "6"
hacienda = { path = "../hacienda" }
hacienda-api = { path = "../hacienda-api" }
# `jobs` is required by `serve`, which constructs the API's job store. hacienda-api
# enables it too; naming it here means this crate does not rely on feature unification
# with a sibling in order to compile.
hacienda-core = { path = "../hacienda-core", features = ["jobs", "ner-candle"] }
num_cpus = "1"
serde = { workspace = true }
serde_json = { workspace = true }
# YAML config file support, so hacienda.yaml discovers alongside hacienda.toml/.json.
serde_yaml_ng = "0.10"
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
xberg = { workspace = true }

[dev-dependencies]
tempfile = "3"

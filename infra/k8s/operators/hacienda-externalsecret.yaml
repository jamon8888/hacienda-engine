# hacienda ExternalSecret - Deploy to each environment namespace
# This creates the K8s Secret that hacienda-api pods consume

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hacienda-secrets
  namespace: hacienda-prod  # Change for staging/dev
  labels:
    app: hacienda-api
    environment: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hacienda-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Database URL is used directly
        DATABASE_URL: '{{ index . "database-url" }}'
        # Pseudonym key used directly
        HACIENDA_PSEUDONYM_ACTIVE_KEY: '{{ index . "pseudonym-active-key" }}'
        HACIENDA_PSEUDONYM_KEY_KEY_1: '{{ index . "pseudonym-key-material" }}'
        HACIENDA_PSEUDONYM_KEY_KEY_2: '{{ index . "pseudonym-key-material-2" }}'
        # Redis URL used directly
        REDIS_URL: '{{ index . "redis-url" }}'
        # S3 credentials for AWS SDK
        AWS_ACCESS_KEY_ID: '{{ index . "s3-access-key" }}'
        AWS_SECRET_ACCESS_KEY: '{{ index . "s3-secret-key" }}'
        AWS_ENDPOINT_URL: '{{ index . "s3-endpoint" }}'
        AWS_REGION: '{{ index . "s3-region" }}'
        AWS_S3_BUCKET: '{{ index . "s3-bucket" }}'
        # Auth secrets
        JWT_SECRET: '{{ index . "jwt-secret" }}'
        API_KEY_SALT: '{{ index . "api-key-salt" }}'
  data:
    - secretKey: database-url
      remoteRef:
        key: hacienda/prod/database
        property: url
    - secretKey: pseudonym-active-key
      remoteRef:
        key: hacienda/prod/pseudonym
        property: active_key
    - secretKey: pseudonym-key-material
      remoteRef:
        key: hacienda/prod/pseudonym
        property: key_1
    - secretKey: pseudonym-key-material-2
      remoteRef:
        key: hacienda/prod/pseudonym
        property: key_2
    - secretKey: redis-url
      remoteRef:
        key: hacienda/prod/redis
        property: url
    - secretKey: s3-access-key
      remoteRef:
        key: hacienda/prod/s3
        property: access_key
    - secretKey: s3-secret-key
      remoteRef:
        key: hacienda/prod/s3
        property: secret_key
    - secretKey: s3-endpoint
      remoteRef:
        key: hacienda/prod/s3
        property: endpoint
    - secretKey: s3-region
      remoteRef:
        key: hacienda/prod/s3
        property: region
    - secretKey: s3-bucket
      remoteRef:
        key: hacienda/prod/s3
        property: bucket
    - secretKey: jwt-secret
      remoteRef:
        key: hacienda/prod/auth
        property: jwt_secret
    - secretKey: api-key-salt
      remoteRef:
        key: hacienda/prod/auth
        property: api_key_salt

---
# Staging version (deploy to hacienda-staging namespace)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hacienda-secrets
  namespace: hacienda-staging
  labels:
    app: hacienda-api
    environment: staging
spec:
  refreshInterval: 15m  # Faster refresh for staging
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hacienda-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: '{{ index . "database-url" }}'
        HACIENDA_PSEUDONYM_ACTIVE_KEY: '{{ index . "pseudonym-active-key" }}'
        HACIENDA_PSEUDONYM_KEY_KEY_1: '{{ index . "pseudonym-key-material" }}'
        HACIENDA_PSEUDONYM_KEY_KEY_2: '{{ index . "pseudonym-key-material-2" }}'
        REDIS_URL: '{{ index . "redis-url" }}'
        AWS_ACCESS_KEY_ID: '{{ index . "s3-access-key" }}'
        AWS_SECRET_ACCESS_KEY: '{{ index . "s3-secret-key" }}'
        AWS_ENDPOINT_URL: '{{ index . "s3-endpoint" }}'
        AWS_REGION: '{{ index . "s3-region" }}'
        AWS_S3_BUCKET: '{{ index . "s3-bucket" }}'
        JWT_SECRET: '{{ index . "jwt-secret" }}'
        API_KEY_SALT: '{{ index . "api-key-salt" }}'
  data:
    - secretKey: database-url
      remoteRef:
        key: hacienda/staging/database
        property: url
    - secretKey: pseudonym-active-key
      remoteRef:
        key: hacienda/staging/pseudonym
        property: active_key
    - secretKey: pseudonym-key-material
      remoteRef:
        key: hacienda/staging/pseudonym
        property: key_1
    - secretKey: pseudonym-key-material-2
      remoteRef:
        key: hacienda/staging/pseudonym
        property: key_2
    - secretKey: redis-url
      remoteRef:
        key: hacienda/staging/redis
        property: url
    - secretKey: s3-access-key
      remoteRef:
        key: hacienda/staging/s3
        property: access_key
    - secretKey: s3-secret-key
      remoteRef:
        key: hacienda/staging/s3
        property: secret_key
    - secretKey: s3-endpoint
      remoteRef:
        key: hacienda/staging/s3
        property: endpoint
    - secretKey: s3-region
      remoteRef:
        key: hacienda/staging/s3
        property: region
    - secretKey: s3-bucket
      remoteRef:
        key: hacienda/staging/s3
        property: bucket
    - secretKey: jwt-secret
      remoteRef:
        key: hacienda/staging/auth
        property: jwt_secret
    - secretKey: api-key-salt
      remoteRef:
        key: hacienda/staging/auth
        property: api_key_salt

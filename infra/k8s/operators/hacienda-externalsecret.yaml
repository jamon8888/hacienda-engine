# hacienda ExternalSecret - Deploy to each environment namespace
# This creates the K8s Secret that hacienda-api pods consume

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hacienda-secrets
  namespace: hacienda-prod  # Change for staging/dev
  labels:
    app: hacienda-api
    environment: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hacienda-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Database URL is used directly
        DATABASE_URL: "{{ .database_url }}"
        # Pseudonym key used directly
        HACIENDA_PSEUDONYM_ACTIVE_KEY: "{{ .pseudonym_active_key }}"
        # Redis URL used directly
        REDIS_URL: "{{ .redis_url }}"
        # S3 credentials for AWS SDK
        AWS_ACCESS_KEY_ID: "{{ .s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .s3_secret_key }}"
        AWS_ENDPOINT_URL: "{{ .s3_endpoint }}"
        AWS_REGION: "{{ .s3_region }}"
        AWS_S3_BUCKET: "{{ .s3_bucket }}"
        # Auth secrets
        JWT_SECRET: "{{ .jwt_secret }}"
        API_KEY_SALT: "{{ .api_key_salt }}"
  data:
    - secretKey: database_url
      remoteRef:
        key: hacienda/prod/database
        property: url
    - secretKey: pseudonym_active_key
      remoteRef:
        key: hacienda/prod/pseudonym
        property: active_key
    - secretKey: redis_url
      remoteRef:
        key: hacienda/prod/redis
        property: url
    - secretKey: s3_access_key
      remoteRef:
        key: hacienda/prod/s3
        property: access_key
    - secretKey: s3_secret_key
      remoteRef:
        key: hacienda/prod/s3
        property: secret_key
    - secretKey: s3_endpoint
      remoteRef:
        key: hacienda/prod/s3
        property: endpoint
    - secretKey: s3_region
      remoteRef:
        key: hacienda/prod/s3
        property: region
    - secretKey: s3_bucket
      remoteRef:
        key: hacienda/prod/s3
        property: bucket
    - secretKey: jwt_secret
      remoteRef:
        key: hacienda/prod/auth
        property: jwt_secret
    - secretKey: api_key_salt
      remoteRef:
        key: hacienda/prod/auth
        property: api_key_salt

---
# Staging version (deploy to hacienda-staging namespace)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hacienda-secrets
  namespace: hacienda-staging
  labels:
    app: hacienda-api
    environment: staging
spec:
  refreshInterval: 15m  # Faster refresh for staging
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hacienda-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ .database_url }}"
        HACIENDA_PSEUDONYM_ACTIVE_KEY: "{{ .pseudonym_active_key }}"
        REDIS_URL: "{{ .redis_url }}"
        AWS_ACCESS_KEY_ID: "{{ .s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .s3_secret_key }}"
        AWS_ENDPOINT_URL: "{{ .s3_endpoint }}"
        AWS_REGION: "{{ .s3_region }}"
        AWS_S3_BUCKET: "{{ .s3_bucket }}"
        JWT_SECRET: "{{ .jwt_secret }}"
        API_KEY_SALT: "{{ .api_key_salt }}"
  data:
    - secretKey: database_url
      remoteRef:
        key: hacienda/staging/database
        property: url
    - secretKey: pseudonym_active_key
      remoteRef:
        key: hacienda/staging/pseudonym
        property: active_key
    - secretKey: redis_url
      remoteRef:
        key: hacienda/staging/redis
        property: url
    - secretKey: s3_access_key
      remoteRef:
        key: hacienda/staging/s3
        property: access_key
    - secretKey: s3_secret_key
      remoteRef:
        key: hacienda/staging/s3
        property: secret_key
    - secretKey: s3_endpoint
      remoteRef:
        key: hacienda/staging/s3
        property: endpoint
    - secretKey: s3_region
      remoteRef:
        key: hacienda/staging/s3
        property: region
    - secretKey: s3_bucket
      remoteRef:
        key: hacienda/staging/s3
        property: bucket
    - secretKey: jwt_secret
      remoteRef:
        key: hacienda/staging/auth
        property: jwt_secret
    - secretKey: api_key_salt
      remoteRef:
        key: hacienda/staging/auth
        property: api_key_salt

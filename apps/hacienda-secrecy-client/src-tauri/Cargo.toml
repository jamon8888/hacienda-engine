[package]
name = "hacienda-secrecy-client"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["ner-candle", "local-rag"]
# The desktop package enables Candle by default because LocalFull requires the
# real detector. The hacienda-core feature itself is target-gated by
# hacienda-core, so wasm builds never compile Candle or load a filesystem
# checkpoint.
ner-candle = ["hacienda-core/ner-candle"]
local-rag = ["hacienda-backend/embeddings", "hacienda-backend/chunking"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
blake3 = "1"
hacienda-core = { path = "../../../hacienda-core" }
hacienda-client-core = { path = "../../../crates/hacienda-client-core" }
# Shared pinned NER model identity (same registry Studio imports). The Tauri
# host still owns download/cache; this crate verifies the resolved directory.
hacienda-model-assets = { path = "../../../crates/hacienda-model-assets" }
hacienda-backend = { path = "../../../crates/hacienda-backend", features = ["lancedb"] }
hacienda-rag = { path = "../../../crates/hacienda-rag", features = ["lancedb"] }
futures = "0.3"
getrandom = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
xberg = { git = "https://github.com/xberg-io/xberg.git", rev = "507fca3d3cc5b8e71f0e416af4a8aec15e18d2cd", default-features = false, features = [
    "tokio-runtime",
    "embeddings",
    "chunking",
    # Xberg has no bundled ONNX Runtime archive for Intel macOS. Dynamic loading
    # also lets release packaging provide the platform-matched runtime explicitly.
    "ort-dynamic",
    "pdf",
    "office",
    "excel",
    "email",
    "hwp",
    "hwpx",
    "iwork",
    "archives",
    "keywords",
    "summarization",
    "qr-codes",
] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacienda Studio — Local Document Intelligence</title>
    <meta
      name="description"
      content="Convert documents to RAG-ready Markdown with entity-linked metadata. 100% local via WebAssembly."
    />
    <!--
      Keep this connect-src in sync with `vercel.json`'s Content-Security-Policy header —
      both apply in production simultaneously (a request must satisfy the intersection of
      all active CSPs), so a host missing from either one blocks the request regardless of
      what the other allows. `us.aws.cdn.hf.co` and `cdn.huggingface.co` are two concrete
      hosts Hugging Face's `resolve/main/...` endpoint has redirected a model download to;
      the wildcards below (`*.huggingface.co`, `*.hf.co`) cover those plus any other
      regional/CDN subdomain HF might redirect to next, rather than chasing each one as it
      shows up in a Content-Security-Policy console error. `vercel.live`/`ws-us3.pusher.com`
      are Vercel's own Toolbar/Comments feature on preview deployments — see
      https://vercel.com/docs/vercel-toolbar/managing-toolbar's CSP section for the exact
      set of directives it documents needing.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' blob: ws: wss: https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com https://vercel.live wss://ws-us3.pusher.com"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

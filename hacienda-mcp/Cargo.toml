[package]
name = "hacienda-mcp"
version.workspace = true
edition.workspace = true
description = "MCP (Model Context Protocol) server exposing HaciendaFacade to AI agents"
license.workspace = true

[dependencies]
# The guarded facade — every tool in this crate calls through it, never through `xberg`
# directly. See the crate's module doc for why: xberg ships its own MCP server behind its
# `mcp` feature, and it is deliberately never enabled here (root `Cargo.toml`'s `xberg`
# entry explains why) — it would expose unredacted document content by a transport the
# redaction guard was never wired into.
hacienda = { path = "../hacienda" }
hacienda-core = { path = "../hacienda-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
xberg = { workspace = true }

# Pinned to the same version xberg itself depends on (`crates/xberg/Cargo.toml`) — not to
# match it for its own sake, but because it means both servers speak the same generation
# of the protocol against the same Rust SDK, which is the thing worth keeping in sync.
# `server` + `macros` for the `#[tool_router]`/`#[tool]` attribute macros, `transport-io`
# for the stdio transport `hacienda mcp serve` uses (M1a). HTTP/streamable transport
# (`transport-streamable-http-server`, `server-side-http`) is deferred to M1b — see the
# crate's module doc.
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io"] }

[dev-dependencies]
tempfile = { workspace = true }

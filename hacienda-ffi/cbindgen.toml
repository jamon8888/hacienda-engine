/**
 * The UTC time zone. This is the most efficient time zone when you don't need the local time.
 * It is also used as an offset (which is also a dummy type).
 *
 * Using the `TimeZone` (./trait.TimeZone.html) methods
 * on the UTC struct is the preferred way to construct `DateTime<Utc>`
 * instances.
 * \\code
 * use chrono::{DateTime, TimeZone, Utc};
 *
 * let dt = DateTime::from_timestamp(61, 0).unwrap();
 *
 * assert_eq!(Utc.timestamp_opt(61, 0).unwrap(), dt);
 * assert_eq!(Utc.with_ymd_and_hms(1970, 1, 1, 0, 1, 1).unwrap(), dt);
 * \\endcode
 */
typedef uint64_t HACIENDAUtc;
/**
 * A Universally Unique Identifier (UUID).
 * \\code
 * Parse a UUID given in the simple format and print it as a urn:
 *
 * let my_uuid = Uuid::parse_str("a1a2a3a4b1b2c1c2d1d2d3d4d5d6d7d8")?;
 *
 * println!("{}", my_uuid.urn());
 *
 * Create a new random (V4) UUID and print it out in hexadecimal form:
 *
 * // Note that this requires the `v4` feature enabled in the uuid crate.
 * let my_uuid = Uuid::new_v4();
 *
 * println!("{}", my_uuid);
 *
 * # Formatting
 *
 * A UUID can be formatted in one of a few ways:
 *
 * * `simple` (#method.simple): `a1a2a3a4b1b2c1c2d1d2d3d4d5d6d7d8`.
 * * `hyphenated` (#method.hyphenated):
 *   `a1a2a3a4-b1b2-c1c2-d1d2-d3d4d5d6d7d8`.
 * * `urn` (#method.urn): `urn:uuid:A1A2A3A4-B1B2-C1C2-D1D2-D3D4D5D6D7D8`.
 * * `braced` (#method.braced): `{a1a2a3a4-b1b2-c1c2-d1d2-d3d4d5d6d7d8}`.
 *
 * The default representation when formatting a UUID with `Display` is
 * hyphenated:
 *
 * let my_uuid = Uuid::parse_str("a1a2a3a4b1b2c1c2d1d2d3d4d5d6d7d8")?;
 *
 * assert_eq!(
 *     "a1a2a3a4-b1b2-c1c2-d1d2-d3d4d5d6d7d8",
 *     my_uuid.to_string(),
 * );
 *
 * Other formats can be specified using adapter methods on the UUID:
 *
 * let my_uuid = Uuid::parse_str("a1a2a3a4b1b2c1c2d1d2d3d4d5d6d7d8")?;
 *
 * assert_eq!(
 *     "urn:uuid:a1a2a3a4-b1b2-c1c2-d1d2-d3d4d5d6d7d8",
 *     my_uuid.urn().to_string(),
 * );
 *
 * # Endianness
 *
 * The specification for UUIDs encodes the integer fields that make up the
 * value in big-endian order. This crate assumes integer inputs are already in
 * the correct order by default, regardless of the endianness of the
 * environment. Most methods that accept integers have a `_le` variant (such as
 * `from_fields_le`) that assumes any integer values will need to have their
 * bytes flipped, regardless of the endianness of the environment.
 *
 * Most users won't need to worry about endianness unless they need to operate
 * on individual fields (such as when converting between Microsoft GUIDs). The
 * important things to remember are:
 *
 * - The endianness is in terms of the fields of the UUID, not the environment.
 * - The endianness is assumed to be big-endian when there's no `_le` suffix
 *   somewhere.
 * - Byte-flipping in `_le` methods applies to each integer.
 * - Endianness roundtrips, so if you create a UUID with `from_fields_le`
 *   you'll get the same values back out with `to_fields_le`.
 *
 * # ABI
 *
 * The `Uuid` type is always guaranteed to be have the same ABI as `Bytes`.
 * \\endcode
 */
typedef uint64_t HACIENDAUuid;
typedef uint64_t HACIENDAValue;
/**
 * A Tier 0 "schema vertical": a named set of zero-shot labels handed to the NER
 * backend *in addition to* the base categories (`Person`, `Organization`, `Location`,
 * `Email`, `Phone`). No weights are loaded and no model is reloaded â a vertical is
 * arguments to an inference call, nothing more. See
 * `superpowers/specs/2026-07-31-vertical-model-specialisation-design.md` Â§4.1.
 *
 * # Footgun: the alias-table collision
 *
 * `to_pii_category` maps some `Custom` label strings onto existing
 * `PiiCategory` variants *before* they would otherwise become
 * `PiiCategory::Custom(label)` â for example the label `"iban"` (case-insensitively)
 * becomes `Iban`, not `Custom("iban")`. A vertical author
 * who picks a label that happens to collide with that alias table gets the aliased
 * category's downstream behaviour (its pseudonym token name, its place in exports,
 * its interaction with other detectors) instead of a bespoke `Custom` category. This
 * is deliberate for the *known* aliases (a vertical calling something `"iban"` should
 * get real IBAN handling) but is easy to trip over by accident with a near-miss label
 * (`"iban_number"` does *not* alias and stays `Custom("iban_number")`). Check
 * `to_pii_category`'s alias table before choosing a label if the distinction matters
 * to you.
 */
typedef struct HACIENDAVerticalConfig HACIENDAVerticalConfig;
/**
 * Policy controlling when VLM (Vision Language Model) OCR is used as a fallback.
 *
 * This knob is syntactic sugar over the explicit `OcrPipelineConfig` stage
 * ordering. When `vlm_fallback` is set and `pipeline` is `None`, an equivalent
 * pipeline is synthesised at extraction time:
 *
 * - `VlmFallbackPolicy.Disabled` â no synthesis; single-backend mode (default).
 * - `VlmFallbackPolicy.OnLowQuality` â tries the classical backend first; if the
 *   result scores below `quality_threshold`, tries VLM.
 * - `VlmFallbackPolicy.Always` â skips the classical backend and sends every page
 *   to the VLM.
 *
 * When `OcrConfig.pipeline` is explicitly set, `vlm_fallback` is ignored â the
 * explicit pipeline takes precedence.
 * \\note Both `OnLowQuality` and `Always` require `OcrConfig.vlm_config` to be `Some`.
 * Constructing an `OcrConfig` with one of these policies but no `vlm_config` is
 * detected by `OcrConfig::validate` and will surface as a
 * `Validation` error at extraction time, not a panic.
 * \\code
 * use xberg::{OcrConfig, VlmFallbackPolicy, LlmConfig};
 *
 * let config = OcrConfig {
 *     vlm_fallback: VlmFallbackPolicy::OnLowQuality { quality_threshold: 0.6 },
 *     vlm_config: Some(LlmConfig {
 *         model: "openai/gpt-4o-mini".to_string(),
 *         ..Default::default()
 *     }),
 *     ..Default::default()
 * };
 *
 * // Threshold calibration is deferred to the Stage 0 benchmark harness.
 * assert!(matches!(config.vlm_fallback, VlmFallbackPolicy::OnLowQuality { .. }));
 * \\endcode
 */
typedef struct HACIENDAVlmFallbackPolicy HACIENDAVlmFallbackPolicy;
typedef struct HACIENDAWarmResult HACIENDAWarmResult;
/**
 * Supported Whisper model sizes.
 *
 * These map to published ONNX exports on Hugging Face (onnx-community or
 * similar orgs). The actual filenames and repos are resolved inside the
 * transcription engine.
 */
typedef struct HACIENDAWhisperModel HACIENDAWhisperModel;
/**
 * PII categories the pattern engine recognises.
 */
typedef struct HACIENDAXbergPiiCategory HACIENDAXbergPiiCategory;
/**
 * Configuration for the redaction post-processor.
 */
typedef struct HACIENDAXbergRedactionConfig HACIENDAXbergRedactionConfig;
/**
 * XML metadata extracted during XML parsing.
 *
 * Provides statistics about XML document structure.
 */
typedef struct HACIENDAXmlMetadata HACIENDAXmlMetadata;
/**
 * YAKE-specific parameters.
 */
typedef struct HACIENDAYakeParams HACIENDAYakeParams;
/**
 * Year range for bibliographic metadata.
 */
typedef struct HACIENDAYearRange HACIENDAYearRange;

[workspace]
resolver = "2"
members = ["crates/hacienda-rag", "crates/hacienda-wasm", "hacienda", "hacienda-api", "hacienda-cli", "hacienda-core", "hacienda-mcp"]
exclude = ["packages/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# The PII implementation is vendored into hacienda-core (see hacienda-core/src/).
# `xberg` below is the only upstream product dependency, consumed as a facade.
# Do not reintroduce pii-* path dependencies.
#
# Entries are kept alphabetical for `cargo sort`.
[workspace.dependencies]
# Deterministic (synthetic-IV) AEAD for reversible pseudonymisation — see
# superpowers/plans/2026-07-28-phase0-pseudonymisation.md. Pinned to the 0.7 stable line
# on purpose: crates.io reports 0.8.0-rc.3 as latest, and a pre-release AEAD has no place
# in a compliance control.
aes-siv = "0.7"
anyhow = "1.0"
async-trait = "0.1"
# Used by three crates: hacienda-core (auth middleware), hacienda-api (the router), and
# hacienda-cli (`axum::serve`). Declared once so the version cannot skew — a `Router`
# built against one axum and served by another is a type mismatch with an unreadable
# error, not a runtime surprise, but it is still an hour lost.
axum = { version = "0.8", features = ["macros"] }
blake3 = "1.5"
bytes = "1"
# Do not add `default-features = false` here. Defaults include `wasmbind`, which is what
# makes `Utc::now()` read the real clock (via `js-sys`/`Date`) on wasm32-unknown-unknown
# instead of silently returning the epoch — every audit and compliance timestamp depends
# on it (Track L3). `crates/hacienda-wasm`'s wasm32 test asserts a non-1970 timestamp as
# the regression guard for this.
chrono = { version = "0.4", features = ["serde"] }
# CLI argument parsing. Deliberately a dependency of `hacienda-cli` alone — §4 of the
# integration design rejects feature-gating this inside `hacienda`, because Cargo
# feature unification would pull clap into every library consumer.
clap = { version = "4", features = ["derive", "env"] }
# base32 for pseudonym tokens (BASE32_NOPAD — no `=` to escape inside a token).
data-encoding = "2.11"
# `Stream`/`StreamExt` combinators for RAG streaming answer synthesis (Track 3,
# `hacienda-rag`'s `stream` feature) — maps a `liter-llm` token-chunk stream to
# `AnswerEvent`s without pulling in a full async-runtime-specific stream crate.
futures = "0.3"
# Direct LLM client for streaming chat completions (Track 3, `hacienda-rag`'s `stream`
# feature). A *direct* dependency deliberately bypassing xberg's own `llm` module: that
# module's `complete_text`/`complete_with_json_schema` are whole-response only (no
# `chat_stream`), and its client constructor is `pub(crate)` (see
# `crates/hacienda-rag/src/stream.rs`'s module doc for the investigation). `xberg::LlmConfig`
# itself is unconditional (no feature gate, pure config data — see
# `xberg/src/core/config/llm.rs`), so this dependency does NOT enable xberg's own
# `liter-llm` feature, which would additionally pull in `ocr-pipeline` or ONNX Runtime for
# no benefit here — mirrors the xberg comment above about not re-adding features without a
# call site. Version pinned to match xberg's own workspace pin (see xberg's root
# `Cargo.toml`) so the wire types constructed here match what liter-llm's HTTP layer
# expects.
liter-llm = { version = "1.11.3", default-features = false, features = ["native-http", "tracing"] }
regex = "1.10"
# HTTP client for the presigned-upload `confirm` step's server-side HEAD request against
# the object store (Phase 13 Task 4). Already resolved transitively via `xberg`'s `hf-hub`
# dependency with a rustls (not native-tls/openssl) backend and no other TLS stack appears
# anywhere else in Cargo.lock — matching that backend explicitly here rather than pulling
# a second one.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# Pure-computation AWS SigV4 presigned-URL signing (Phase 13 Task 4). Deliberately not
# `aws-sdk-s3`: that pulls its own credential-provider chain, retry/tower middleware stack,
# and a second HTTP client, none of which this feature needs — the client PUTs directly to
# the presigned URL, and the server only ever issues a HEAD to confirm completion (via
# `reqwest` above). `rusty-s3` has no HTTP client of its own; it only computes SigV4 URLs,
# which keeps this dependency-light on a RAM-constrained build host.
rusty-s3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# NFKC normalisation. Part of the pseudonym token contract: it decides which spellings
# co-refer, so changing it later re-derives every token ever emitted.
unicode-normalization = "0.1"
# `rusty-s3`'s `Bucket::new` takes a `url::Url` directly and does not re-export the
# `url` crate itself — needed by `S3Config::endpoint` (Phase 13 Task 4). Already resolved
# transitively via `reqwest`/`rusty-s3`; version pinned to match.
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
# Drop-in `Instant`/`SystemTime` for code that must run on both native targets and
# wasm32-unknown-unknown (Track L3): passes through to `std::time` natively, backs onto
# `Performance`/`Date` in the browser. `std::time::Instant::now()` panics on wasm32; this
# is the seam that avoids it without a `#[cfg]` at every call site.
web-time = "1"
# xberg
#
# Format coverage: every document-format extractor xberg ships as a pure-Rust feature
# (no native toolchain, no model download, no ONNX Runtime) is enabled here, so
# `facade.rs`'s `extract_all` — which calls `xberg::extract` for a single input and
# `xberg::extract_batch` for more than one — actually handles what a caller sends it
# instead of erroring on anything but plain text. `pdf` (`pdf_oxide`/`lopdf`), `office`
# (docx/xlsx/pptx via `zip`/`roxmltree`,
# pulls in `html`/`notebook`), `excel` (`calamine`), `email` (`mail-parser`/
# `outlook-pst`), `hwp`/`hwpx` (`unhwp`), `iwork` (`zip`/`snap`), `archives`
# (`zip`/`tar`/`sevenz-rust2`) are all crates.io Rust libraries — confirmed against
# xberg's own `Cargo.toml` — so this is a feature-flag change only, zero xberg source
# touched. `xml` comes along transitively via `office`.
#
# Deliberately still NOT enabled: anything needing a native system library or a
# model download at runtime — `ocr`/`ocr-wasm` (Tesseract binary), `heic`/
# `wordperfect` (native C/C++ libs), `embeddings`/`reranking`/`layout-detection`/
# `auto-rotate`/`ner-onnx`/`paddle-ocr` (ONNX Runtime + HuggingFace model fetch).
# Those need infrastructure provisioning (`ORT_LIB_LOCATION`, a Tesseract install, a
# model cache) beyond a Cargo feature, same class of gap the `.ai-rulez` OCR/ONNX
# skills already document for xberg itself — track separately rather than silently
# skip. `xberg::extract_batch`'s config types for embeddings, reranking, and
# captioning stay exported unconditionally regardless (unaffected by this feature
# set), so hacienda's `ExtractionConfig` passthrough already round-trips them even
# before those backends are wired in.
#
# X1 (`superpowers/specs/2026-08-13-X1-pure-rust-enrichment-features.md`): four of
# the spec's six capabilities need no ONNX Runtime, no native system library, and
# (for one of them) no model download.
# `keywords`/`summarization` are pure-Rust text transforms (YAKE/RAKE, extractive
# TextRank); `qr-codes` decodes via `rqrr` (already pulled in transitively by
# `pdf`'s `image` dep). All three are off by default at the *config* level too
# (`ExtractionConfig.keywords` / `.summarization` / `.qr_codes` default to `None`)
# — enabling the Cargo feature only makes the capability reachable via
# `[extraction]` config, it does not turn it on for every document.
# `candle-trocr` is one backend of xberg's candle-based VLM OCR
# (`candle-ocr` umbrella) — hacienda already vendors candle for its GLiNER2 NER
# backend, so this is new model weights, not a new inference runtime; TrOCR is the
# smallest/best-understood backend, picked over the full `candle-vlm-ocr` umbrella
# for the first pass per the spec's §3.
#
# `static-embeddings` (the spec's fifth capability) is deliberately NOT enabled here,
# unlike the four above: this repo's own contributing guidelines require a Cargo
# feature addition to the `xberg` dependency to have a matching call site, and none
# exists — nothing in `hacienda-rag`/`hacienda-api` constructs the
# `EmbeddingModelType::Preset { name: "lightweight" }` config needed to reach it
# through `xberg::embed_texts`/`embed_texts_async`. Enabling it would only grow the
# native build surface for a capability nothing can call. See the X1 spec's §6 for
# the fuller reasoning — it also documents a separate finding, that reaching this
# safely needs an ingestion-time redaction guard (`GuardedLlm`-shaped) that doesn't
# exist yet for the vector-store embedding path, a pre-existing E4 gap. Re-enable once
# both a call site and that guard exist. Found by CodeRabbit review on this branch;
# caught before merge.
#
# `candle-trocr` gotcha: enabling it compiles in xberg's `ocr-pipeline`, which
# changes `extractors::image`'s behaviour even for callers who never touch OCR —
# without it, an image input always fell back to metadata-only extraction; with
# it, `ExtractionConfig::effective_disable_ocr()` (default `false`) no longer skips
# the OCR branch, and a caller with no `[extraction.ocr]` section falls through to
# `OcrConfig::default()`, whose backend is `"tesseract"` — not registered here,
# since `ocr`/`ocr-wasm` stay off. That would turn every image extraction into a
# hard error for every existing caller. `HaciendaFacade::extract_all` guards
# against this directly (see its own comment) by forcing `disable_ocr = true`
# unless the caller's config already set `extraction.ocr` explicitly — so OCR
# stays a no-op by default, exactly as before this feature was enabled, and only
# runs for a caller who opts in with `[extraction.ocr] backend = "candle-trocr"`.
#
# `tree-sitter` — the spec's sixth capability — is deliberately NOT enabled: this
# xberg commit's `impl From<&TreeSitterProcessConfig> for
# tree_sitter_language_pack::ProcessConfig` (`src/core/config/tree_sitter.rs`)
# builds that struct with a field literal that omits `max_source_bytes` and
# `parse_timeout_ms` — fields the crates.io `tree-sitter-language-pack` releases
# Cargo currently resolves to (1.15.0, under this xberg commit's own unpinned
# `^`-range requirement) require. That is a genuine compile error on this xberg
# pin, reproduced locally (`cargo check -p hacienda-core --features tree-sitter`
# fails inside the `xberg` crate itself, not in hacienda's code), not an artifact
# of any sandboxing here — confirmed by isolating the tree-sitter-language-pack
# crate's own build (a separate, pre-existing issue: its build script fetches a
# parser-sources tarball from a GitHub release at build time, which needs
# `TSLP_OFFLINE=1` or real network access to a non-intercepted github.com to
# succeed at all). Re-enable once the xberg pin either updates that `From` impl
# for the newer `ProcessConfig` shape or pins `tree-sitter-language-pack` itself
# to a version predating the two added fields — see
# `superpowers/specs/2026-08-13-X1-pure-rust-enrichment-features.md` §6 for the
# full writeup. `hacienda-core/src/facade.rs`'s `redact_structured_fields` already
# covers `code_intelligence` (the field this feature would populate) so no further
# hacienda-side work blocks re-enabling it once the upstream issue clears.
#
# `mcp` and `api` are deliberately never enabled here: hacienda's MCP server and REST
# API are built against `HaciendaFacade` directly (the redaction guard), not against
# xberg's own unredacted server — see `hacienda-mcp` and `hacienda-api`. Enabling
# xberg's `mcp`/`api` features would pull `rmcp`/`axum` server code hacienda never
# calls, for a surface this repo intentionally does not re-expose.
#
# Pinned to a commit rather than `path = "../xberg/crates/xberg"`. The sibling
# checkout is a working tree: it sits on rc.37 and carries uncommitted edits, one of
# which adds an `xberg::pii` module re-exporting the very `pii_*` crates this repo
# vendored away from. Building against it made hacienda's output a function of
# someone's unstaged work. A commit is reproducible and CI can fetch it.
#
# `rev`, not `tag`, and not `v1.0.2`: every xberg release tag from `v1.0.2` through
# at least `v1.0.14` has a `.gitmodules` gitlink for its `test_documents` submodule
# (used only for xberg's own test fixtures — nothing this repo calls touches it) that
# points at a commit no longer reachable in `xberg-io/test_documents` — that repo's
# history has been rewritten since each tag was cut, orphaning every historical pin.
# Cargo populates every submodule of a git dependency unconditionally before it will
# build anything from it, with no per-submodule opt-out, so every tagged release
# fails to fetch at all (confirmed on a clean checkout, not a local cache/proxy
# artifact). `xberg`'s unreleased `main` branch has a currently-valid pin (it tracks
# `test_documents`' actual current history), so this pins an exact commit SHA on
# `main` — as reproducible as a tag, since a SHA cannot move — rather than the branch
# name, which would. Re-pin to a proper release tag once xberg-io fixes the
# submodule reference upstream, or repoints an old tag; check the tag's own gitlink
# resolves (`git ls-tree <tag> -- test_documents`, then try fetching that commit from
# xberg-io/test_documents directly) before trusting a newer tag number alone.
#
# To develop xberg and hacienda together, override locally without editing this file:
#   cargo add --path ../xberg/crates/xberg   # or a [patch."https://github.com/xberg-io/xberg"] in .cargo/config.toml
#
# TEMPORARY: pinned to a patched commit on jamon8888/xberg, not xberg-io/xberg's v1.0.2 tag
# directly, because that tag's `test_documents` git submodule is pinned to a commit
# (4ca54bb) that no longer exists on xberg-io/test_documents's remote — confirmed via a
# direct `git fetch <sha>` ("not our ref"), and true of every xberg-io/xberg tag from
# v1.0.2 through v1.0.14, so no version bump fixes it. Cargo fetches a git dependency's
# submodules unconditionally during dependency resolution, so this breaks `cargo build`
# for the whole workspace regardless of which features are enabled.
#
# jamon8888/xberg@fix/test-documents-submodule-pin is otherwise the identical tree to
# xberg-io/xberg's v1.0.2 tag (commit 9dcc864d) with only that one gitlink repointed to
# test_documents's current valid HEAD. This is documented as a deliberate, temporary
# exception to docs/architecture/README.md §3's policy against this fork entering the
# dependency graph — revert to the upstream tag once xberg-io/xberg or
# xberg-io/test_documents fixes the submodule pin upstream.
xberg = { git = "https://github.com/jamon8888/xberg.git", rev = "9bfbc10acca5c1648547a4d861153d2f5c363340", features = [
    "redaction",
    "ner",
    "tokio-runtime",
    "pdf",
    "office",
    "excel",
    "email",
    "hwp",
    "hwpx",
    "iwork",
    "archives",
    "keywords",
    "summarization",
    "qr-codes",
    "candle-trocr",
] }
# Key material must not survive a drop. `PseudonymKey` holds the secret that
# de-pseudonymises an entire corpus.
zeroize = { version = "1.9", features = ["zeroize_derive"] }
# Postgres client for Phase 9 durable store backend. `runtime-tokio` for pool,
# `postgres` for the driver, `uuid`/`chrono`/`json` for compile-time checked
# query! macros with native types. `migrate` feature for embedded migrations.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
# Argon2id for API key hashing (Phase 11). Slow hash for credential storage.
argon2 = { version = "0.5", features = ["std"] }
# Random number generation for API key entropy.
rand = { version = "0.8", features = ["std"] }
# Disposable-Postgres test fixture for the `postgres` feature's integration tests (Phase 9
# Task 1 Step 5) — spins up a real container via the local Docker daemon so
# `connect_and_migrate` and friends don't need a human-supplied `DATABASE_URL`. Dev-only:
# never a runtime dependency of any published crate.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

# Profiles must live in the workspace root manifest. Cargo silently ignores
# `[profile.*]` in path dependencies, so the tuning in ../xberg/Cargo.toml has never
# applied to this workspace — these builds were defaulting to full debuginfo across the
# whole dependency graph.
[profile.dev]
# `line-tables-only` keeps backtraces with file/line numbers for panics and test
# failures, but drops variable/type debuginfo. Full `debug = 2` produced ~5.9 GB of
# artifacts, and builds here are I/O-bound rather than CPU-bound, so artifact size is
# the dominant cost. Use `debug = 2` temporarily if you need a stepping debugger.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies are built once and then only read back. They never need debuginfo, and
# stripping it is the single largest reduction in bytes written and re-read per build.
[profile.dev.package."*"]
debug = false

# Test/bench profiles inherit from dev, but state the debuginfo intent explicitly so a
# future `[profile.test]` addition does not silently reintroduce full debuginfo.
[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

# `hacienda-wasm` (Track L2) is the one crate whose release artifact is a browser
# download rather than a server binary, so it alone trades runtime speed for size —
# mirroring xberg's own `[profile.release.package.xberg-wasm] opt-level = "z"` rather
# than changing `[profile.release]` (and therefore hacienda-cli/hacienda-api) workspace-wide.
[profile.release.package.hacienda-wasm]
opt-level = "z"
codegen-units = 1

[package]
name = "hacienda-wasm"
version.workspace = true
edition.workspace = true
description = "wasm32 bindings for hacienda-core's pii/redaction pipeline"
license.workspace = true

# `cdylib` is the browser-loadable artifact; `rlib` keeps the crate usable as a normal
# Rust dependency (native `cargo test`/`cargo doc`, no wasm-bindgen JS glue involved).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Real Candle GLiNER2 NER, loaded from in-memory bytes — see
# `hacienda-core`'s `ner-candle-wasm` feature and `NerDetector::from_candle_bytes`. Off
# by default so the lean regex-only artifact stays buildable without pulling in the
# candle/xberg-gliner dependency chain.
ner-candle-wasm = ["hacienda-core/ner-candle-wasm"]
# Enable Wasm atomics for threading (Tier 3.1). Requires nightly Rust with atomics support.
# Enables hacienda-core's atomics feature for thread-safe IndexedDB audit store, and
# pulls in wasm-bindgen-rayon (unused so far — infrastructure prep only, no rayon
# thread pool is actually wired up yet).
atomics = ["hacienda-core/atomics", "dep:wasm-bindgen-rayon"]

[dependencies]
hacienda-core = { path = "../../hacienda-core", default-features = false }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Tier 3.1 prep only, behind the `atomics` feature above — a wasm32-only threading
# dependency has no reason to be pulled into native builds (incl. this crate's own
# `rlib` `cargo test`/`cargo doc` target) or into the default single-threaded build.
wasm-bindgen-rayon = { version = "1.2", optional = true }
# `uuid` (Track L3) turned out not to need this — its wasm32 randomness is a
# self-contained WebCrypto binding, not `getrandom` (see `hacienda-core/Cargo.toml`).
# Kept as a precaution for any other transitive `getrandom` 0.3+ consumer pulled in by
# `xberg`'s `wasm-target` features (tract/candle): without the `wasm_js` backend
# selected, such a consumer fails to *compile* for wasm32-unknown-unknown, and that
# failure is easy to misread as unrelated to randomness.
getrandom = { version = "0.4", features = ["wasm_js"] }
# `AuditHandle` (Track C3) mints each `AuditEntryInput.id` itself, mirroring
# `HaciendaFacade::record_audit`'s `uuid::Uuid::new_v4()` — the `js` feature is the same
# self-contained WebCrypto binding `hacienda-core` uses, not `getrandom`.
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Used directly by `tests/wasm.rs` to assert the audit segment's uuid/timestamp are
# real — not to re-implement anything `hacienda-core` already does.
chrono = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
uuid = { workspace = true, features = ["js"] }


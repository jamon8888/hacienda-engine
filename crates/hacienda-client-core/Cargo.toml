[package]
name = "hacienda-client-core"
version.workspace = true
edition = "2024"
rust-version = "1.85"
license.workspace = true
description = "Trust-boundary contracts for Hacienda client installation profiles"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
# The installation contract re-exported above (`InstallationConfig`, validation,
# resolution) lives in its own leaf crate so `hacienda-core` can depend on it too —
# see that crate's module doc for why neither obvious home works.
hacienda-installation = { path = "../hacienda-installation" }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

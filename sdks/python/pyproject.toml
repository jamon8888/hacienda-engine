[project]
name = "hacienda-sdk"
version = "0.1.0"
description = "Official Python client for the hacienda-engine PII redaction and compliance API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# attrs is not just this file's dependency: every model in src/hacienda_sdk/_generated/
# (openapi-python-client output, regenerated by scripts/generate.sh) is an `@attrs.define`
# class, so it's a hard runtime requirement for anyone who `pip install`s this package —
# not just a dev-time codegen tool. Discovered because it was missing here: a fresh
# venv installing only this package's declared deps fails on `import hacienda_sdk` with
# `ModuleNotFoundError: No module named 'attrs'`.
dependencies = ["httpx>=0.27", "attrs>=23"]

[project.urls]
Homepage = "https://github.com/jamon8888/hacienda-engine"
Repository = "https://github.com/jamon8888/hacienda-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hacienda_sdk"]

[dependency-groups]
dev = [
    "openapi-python-client>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# _generated/ is codegen output, not reviewed source — never linted, even when
# explicitly passed on the command line (`ruff check src`).
extend-exclude = ["src/hacienda_sdk/_generated"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
exclude = ["src/hacienda_sdk/_generated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

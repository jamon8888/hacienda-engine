version: "3"

vars:
  PLAN: docs/superpowers/plans/2026-07-27-hacienda.md
  SPEC: docs/superpowers/specs/2026-07-27-hacienda-design.md

tasks:
  # Setup
  setup:
    desc: Install all toolchains (rust, alef, poly, task, cargo-hack, wasm-pack)
    cmds:
      - rustup toolchain install nightly
      - cargo install cargo-alef cargo-poly task cargo-hack
      - poly hooks install
      - cargo install cargo-llvm-cov
      # For `build:wasm` / apps/hacienda-studio's `predev`/`prebuild` (crates/hacienda-wasm).
      - cargo install wasm-pack

  # Development
  dev:
    desc: Fast inner loop — type-check then test (~30s warm)
    cmds:
      - task check:rust
      - task test

  check:rust:
    desc: Type-check Rust incl. tests — fastest correctness signal, skips codegen
    cmds:
      - cargo check -p hacienda -p hacienda-core --all-targets

  verify:
    desc: Pre-push gate — format, full lint, and tests
    cmds:
      - task fmt:check
      - task lint:check
      - task test

  # Building
  build:
    desc: Build Rust core (debug)
    cmds:
      - cargo build -p hacienda -p hacienda-core

  build:release:
    desc: Build Rust core (release)
    cmds:
      - cargo build -p hacienda -p hacienda-core --release

  build:bindings:
    desc: Build all language bindings
    cmds:
      - alef build --all-targets --release

  build:wasm:
    desc: Build crates/hacienda-wasm's pkg/ for apps/hacienda-studio (not committed; run before `npm run dev`/`build` there)
    cmds:
      - wasm-pack build --target web --no-default-features crates/hacienda-wasm

  build:all:
    desc: Build core + all bindings
    cmds:
      - task build:release
      - task build:bindings

  # Testing
  test:
    desc: Run Rust tests
    cmds:
      - cargo test -p hacienda -p hacienda-core

  test:bindings:
    desc: Run binding tests
    cmds:
      - alef test --all-languages

  test:all:
    desc: Full test suite
    cmds:
      - task test
      - task test:bindings

  test:e2e:
    desc: Run E2E tests
    cmds:
      - alef e2e test --all-languages

  test:cov:
    desc: Test with coverage
    cmds:
      - cargo llvm-cov -p hacienda -p hacienda-core --lcov --output-path lcov.info
      - alef test --coverage --all-languages

  # Linting
  lint:
    desc: Run poly lint (all languages)
    cmds:
      - poly lint .

  lint:check:
    desc: Check lint (no fix) — includes whole-workspace clippy
    cmds:
      # `poly lint` never writes, so there is no `--check` flag to pass (it exits 2).
      - poly lint .

  lint:fast:
    desc: Per-file lint only, skipping whole-workspace clippy (~3s vs ~19s)
    cmds:
      - poly lint --no-workspace .

  # ============================================
  # FAST BUILD OPTIMIZER COMMANDS (NEW)
  # ============================================
  
  # Clippy commands
  clippy:fast:
    desc: Fast clippy on core crates only (hacienda, hacienda-core) — ~3s vs ~19s for full workspace
    cmds:
      - cargo clippy -p hacienda -p hacienda-core --all-targets --features ner-candle -- -D warnings

  clippy:fast:fix:
    desc: Fast clippy with auto-fix on core crates only
    cmds:
      - cargo clippy -p hacienda -p hacienda-core --all-targets --features ner-candle --fix -- -D warnings

  clippy:incremental:
    desc: Clippy only on crates with changes since HEAD~1 (detects changed crates automatically)
    cmds:
      - |
        CHANGED_CRATES=$(git diff --name-only HEAD~1 | grep -E '^(hacienda|hacienda-core|hacienda-api|hacienda-cli|hacienda-mcp|crates/hacienda-rag|crates/hacienda-wasm)/' | sed -E 's|^(hacienda|hacienda-core|hacienda-api|hacienda-cli|hacienda-mcp|crates/hacienda-rag|crates/hacienda-wasm)/.*|\1|' | sort -u | tr '\n' ' ' | sed -E 's|crates/hacienda-rag|hacienda-rag|g; s|crates/hacienda-wasm|hacienda-wasm|g')
        if [ -z "$CHANGED_CRATES" ]; then
          CHANGED_CRATES="hacienda hacienda-core"
        fi
        echo "Changed crates: $CHANGED_CRATES"
        for crate in $CHANGED_CRATES; do
          cargo clippy -p $crate --all-targets --features ner-candle -- -D warnings
        done

  clippy:incremental:fix:
    desc: Incremental clippy with auto-fix on changed crates
    cmds:
      - |
        CHANGED_CRATES=$(git diff --name-only HEAD~1 | grep -E '^(hacienda|hacienda-core|hacienda-api|hacienda-cli|hacienda-mcp|crates/hacienda-rag|crates/hacienda-wasm)/' | sed -E 's|^(hacienda|hacienda-core|hacienda-api|hacienda-cli|hacienda-mcp|crates/hacienda-rag|crates/hacienda-wasm)/.*|\1|' | sort -u | tr '\n' ' ' | sed -E 's|crates/hacienda-rag|hacienda-rag|g; s|crates/hacienda-wasm|hacienda-wasm|g')
        if [ -z "$CHANGED_CRATES" ]; then
          CHANGED_CRATES="hacienda hacienda-core"
        fi
        echo "Changed crates: $CHANGED_CRATES"
        for crate in $CHANGED_CRATES; do
          cargo clippy -p $crate --all-targets --features ner-candle --fix -- -D warnings
        done

  clippy:full:
    desc: Full workspace clippy on all crates with all targets
    cmds:
      - cargo clippy --workspace --all-targets --features ner-candle -- -D warnings

  clippy:full:fix:
    desc: Full workspace clippy with auto-fix
    cmds:
      - cargo clippy --workspace --all-targets --features ner-candle --fix -- -D warnings

  # Test commands
  test:fast:
    desc: Fast tests on core crates only (hacienda, hacienda-core)
    cmds:
      - cargo test -p hacienda -p hacienda-core

  test:incremental:
    desc: Tests only on crates with changes since HEAD~1
    cmds:
      - |
        CHANGED_CRATES=$(git diff --name-only HEAD~1 | grep -E '^(hacienda|hacienda-core|hacienda-api|hacienda-cli|hacienda-mcp|crates/hacienda-rag|crates/hacienda-wasm)/' | sed -E 's|^(hacienda|hacienda-core|hacienda-api|hacienda-cli|hacienda-mcp|crates/hacienda-rag|crates/hacienda-wasm)/.*|\1|' | sort -u | tr '\n' ' ' | sed -E 's|crates/hacienda-rag|hacienda-rag|g; s|crates/hacienda-wasm|hacienda-wasm|g')
        if [ -z "$CHANGED_CRATES" ]; then
          CHANGED_CRATES="hacienda hacienda-core"
        fi
        echo "Changed crates: $CHANGED_CRATES"
        for crate in $CHANGED_CRATES; do
          cargo test -p $crate
        done

  test:full:
    desc: Full workspace test suite on all crates
    cmds:
      - cargo test --workspace

  # Check commands (type-check only, fastest)
  check:fast:
    desc: Fast type-check on core crates only (fastest correctness signal)
    cmds:
      - cargo check -p hacienda -p hacienda-core --all-targets

  check:incremental:
    desc: Type-check only on crates with changes since HEAD~1
    cmds:
      - |
        CHANGED_CRATES=$(git diff --name-only HEAD~1 | grep -E '^(hacienda|hacienda-core|hacienda-api|hacienda-cli|hacienda-mcp|crates/hacienda-rag|crates/hacienda-wasm)/' | sed -E 's|^(hacienda|hacienda-core|hacienda-api|hacienda-cli|hacienda-mcp|crates/hacienda-rag|crates/hacienda-wasm)/.*|\1|' | sort -u | tr '\n' ' ' | sed -E 's|crates/hacienda-rag|hacienda-rag|g; s|crates/hacienda-wasm|hacienda-wasm|g')
        if [ -z "$CHANGED_CRATES" ]; then
          CHANGED_CRATES="hacienda hacienda-core"
        fi
        echo "Changed crates: $CHANGED_CRATES"
        for crate in $CHANGED_CRATES; do
          cargo check -p $crate --all-targets
        done

  # Verification pipelines
  verify:fast:
    desc: Fast verification pipeline: check + clippy + test on core crates only (~30-60s)
    cmds:
      - task check:fast
      - task clippy:fast
      - task test:fast

  verify:fast:fix:
    desc: Fast verification with clippy auto-fix
    cmds:
      - task check:fast
      - task clippy:fast:fix
      - task test:fast

  verify:incremental:
    desc: Incremental verification pipeline: check + clippy + test only on changed crates
    cmds:
      - task check:incremental
      - task clippy:incremental
      - task test:incremental

  verify:incremental:fix:
    desc: Incremental verification with clippy auto-fix
    cmds:
      - task check:incremental
      - task clippy:incremental:fix
      - task test:incremental

  # Utility
  sccache:stats:
    desc: Show sccache hit/miss statistics for build caching effectiveness
    cmds:
      - sccache --show-stats

  build:timings:
    desc: Show cargo build timing breakdown to identify bottlenecks
    cmds:
      - cargo build --timings

  fmt:
    desc: Format all code
    cmds:
      - poly fmt --fix .

  fmt:check:
    desc: Check format (no fix)
    cmds:
      - poly fmt --check .

  check:
    desc: Full check (fmt + lint)
    cmds:
      - task fmt:check
      - task lint:check

  # alef
  alef:generate:
    desc: Regenerate all bindings
    cmds:
      - alef all --clean

  alef:verify:
    desc: Verify bindings are up to date
    cmds:
      - alef verify --exit-code

  alef:build:
    desc: Build all bindings
    cmds:
      - alef build --all-targets

  alef:sync:
    desc: Sync versions from Cargo.toml
    cmds:
      - alef sync-versions

  alef:docs:
    desc: Generate docs
    cmds:
      - alef docs

  # E2E per language
  e2e:lang:
    desc: Run E2E for specific language
    vars:
      LANG: python
    cmds:
      - alef e2e test --lang {{.LANG}}

  e2e:all:
    desc: Full E2E matrix
    cmds:
      - task e2e:generate
      - task e2e:build
      - task e2e:test

  e2e:generate:
    cmds:
      - alef e2e generate

  e2e:build:
    cmds:
      - alef build --all-targets --release

  e2e:test:
    cmds:
      - alef test --e2e --all-languages

  # Version management
  versions:sync:
    desc: Sync version from Cargo.toml to all packages
    cmds:
      - alef sync-versions

  update:
    desc: Update all deps (minor/patch)
    cmds:
      - cargo upgrade --manifest-path hacienda/Cargo.toml --manifest-path hacienda-core/Cargo.toml --allow-stale
      - task versions:sync

  upgrade:
    desc: Upgrade all deps (major allowed)
    cmds:
      - cargo upgrade --manifest-path hacienda/Cargo.toml --manifest-path hacienda-core/Cargo.toml
      - task versions:sync

  # Release
  release:
    desc: Create a release (requires clean working tree)
    cmds:
      - git diff --quiet
      - task verify
      - cargo release --workspace --execute

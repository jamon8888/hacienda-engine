[workspace]
alef_version = "0.132.6"
extra_clippy_allows = ["redundant_field_names"]
languages = [
  "python",
  "node",
  "ruby",
  "php",
  "ffi",
  "go",
  "java",
  "csharp",
  "elixir",
  "wasm",
  "kotlin_android",
  "jni",
  "swift",
  "zig",
]

[workspace.tools]
python_package_manager = "uv"
node_package_manager = "npm"

[workspace.package_metadata]
authors = ["Hacienda contributors"]
description = "xberg + PII/Compliance Distribution — GDPR/DORA/AI Act compliant document intelligence"
license = "Apache-2.0"
repository = "https://github.com/jamon8888/hacienda-engine"

[workspace.ownership]
user_owned = ["poly.toml", "rustfmt.toml"]

[workspace.opaque_types]
DateTime = "chrono::DateTime<chrono::Utc>"
Value = "serde_json::Value"

[workspace.dto]
python = "dataclass"
node = "interface"
ruby = "struct"
php = "readonly-class"
elixir = "struct"
go = "struct"
java = "record"
csharp = "record"

[workspace.generate]
bindings = true
errors = true
configs = true
async_wrappers = true
type_conversions = true
package_metadata = true
public_api = true

[workspace.generate_overrides]
wasm = { async_wrappers = false }
java = { async_wrappers = false }
kotlin_android = { async_wrappers = false }

[workspace.docs]
reference_output = "docs-site/src/content/docs/reference"

[workspace.sync]
extra_paths = [
  "hacienda-python/src/__init__.py",
  "hacienda-python/pyproject.toml",
  "hacienda-node/package.json",
  "packages/go/go.mod",
  "hacienda-node/npm/package.json",
  "packages/ruby/hacienda.gemspec",
  "packages/csharp/Hacienda/Hacienda.csproj",
  "packages/elixir/mix.exs",
  "packages/zig/build.zig.zon",
]

[[crates]]
name = "hacienda"
core_import = "hacienda"
error_type = "HaciendaError"
features = ["jobs", "ner-candle", "ner-candle-wasm", "postgres", "rag-embeddings", "s3"]
sources = [
  "hacienda/src/lib.rs",
  "hacienda-core/src/lib.rs",
  "hacienda-core/src/config.rs",
  "hacienda-core/src/facade.rs",
  "hacienda-core/src/error.rs",
  "hacienda-core/src/pii/mod.rs",
  "hacienda-core/src/pii/pipeline.rs",
  "hacienda-core/src/pii/config.rs",
  "hacienda-core/src/redaction/mod.rs",
  "hacienda-core/src/compliance/mod.rs",
  "hacienda-core/src/audit/mod.rs",
  "hacienda-core/src/review/mod.rs",
  "hacienda-core/src/glossary/mod.rs",
]

[[crates.source_crates]]
name = "hacienda-installation"
sources = ["crates/hacienda-installation/src/lib.rs"]
roots = ["InstallationConfig"]

[[crates.source_crates]]
name = "xberg"
from_registry = true
sources = ["src/lib.rs"]
roots = ["ExtractInput", "ExtractionConfig", "ExtractionResult", "ExtractedDocument"]

[[crates.source_crates]]
name = "uuid"
from_registry = true
sources = ["src/lib.rs"]
roots = ["Uuid"]

[[crates.source_crates]]
name = "chrono"
from_registry = true
sources = ["src/lib.rs"]
roots = ["DateTime", "Utc"]

[[crates.source_crates]]
name = "serde_json"
from_registry = true
sources = ["src/lib.rs"]
roots = ["Value"]

[[crates.source_crates]]
name = "url"
from_registry = true
sources = ["src/lib.rs"]
roots = ["Url"]
[crates.output]
python = "hacienda-python/src/"
node = "hacienda-node/src/"
ruby = "packages/ruby/ext/hacienda_rb/src/"
php = "hacienda-php/src/"
ffi = "hacienda-ffi/src/"
go = "packages/go/"
elixir = "packages/elixir/native/hacienda_nif/src/"
wasm = "hacienda-wasm/src/"
java = "packages/java/"
csharp = "packages/csharp/src/"
kotlin_android = "packages/kotlin-android/"
swift = "packages/swift/Sources/Hacienda/"
zig = "packages/zig/src/"


global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "job", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical-alerts"
      continue: true
    - match:
        severity: warning
      receiver: "warning-alerts"

receivers:
  - name: "default"
    email_configs:
      - to: "alerts@example.com"
        send_resolved: true

  - name: "critical-alerts"
    email_configs:
      - to: "oncall@example.com"
        send_resolved: true

  - name: "warning-alerts"
    email_configs:
      - to: "team@example.com"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]

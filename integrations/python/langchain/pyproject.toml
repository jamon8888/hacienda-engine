[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_hacienda"]

[tool.hatch.build.targets.sdist]
include = ["src/langchain_hacienda", "CHANGELOG.md", "LICENSE", "README.md", "pyproject.toml"]

[project]
name = "langchain-hacienda"
version = "0.1.0"
description = "LangChain document loader for hacienda-engine — redacted extraction with PII entities and audit-chain provenance as first-class Document metadata"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "hacienda-engine", email = "contact@hacienda.dev" }]
maintainers = [{ name = "hacienda-engine", email = "contact@hacienda.dev" }]
keywords = [
  "hacienda",
  "langchain",
  "document-loader",
  "pii",
  "redaction",
  "pseudonymization",
  "compliance",
  "audit",
  "rag",
  "llm",
  "ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: General",
  "Typing :: Typed",
]
# hacienda-sdk is this repo's own sdks/python package (PyPI: hacienda-sdk) — see
# ../../README.md's "Dependencies" section for why adapters go through it rather than
# calling hacienda-api directly.
dependencies = ["langchain-core>=0.3,<1.0", "hacienda-sdk>=0.1.0,<1"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "mypy>=1.11"]

# Local monorepo development resolves hacienda-sdk from sdks/python directly (mirrors
# hacienda-studio's `"hacienda-wasm": "file:../../crates/hacienda-wasm/pkg"` npm
# dependency for the same reason: the in-repo package is developed in lockstep with
# this one and isn't necessarily published yet). Drop this once hacienda-sdk has a
# PyPI release this package can pin normally.
[tool.uv.sources]
hacienda-sdk = { path = "../../../sdks/python" }

[project.urls]
Homepage = "https://github.com/jamon8888/hacienda-engine/tree/main/integrations/python/langchain"
Repository = "https://github.com/jamon8888/hacienda-engine/tree/main/integrations/python/langchain"
Issues = "https://github.com/jamon8888/hacienda-engine/issues"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["langchain_hacienda"]

[tool.coverage.report]
fail_under = 80

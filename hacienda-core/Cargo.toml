[package]
name = "hacienda-core"
version.workspace = true
edition.workspace = true
description = "PII, compliance, audit, review, and glossary core for hacienda"
license.workspace = true

[features]
default = ["jobs"]
# Enables the Candle GLiNER2 NER backend (with LoRA adapter support) through xberg.
ner-candle = ["xberg/ner-candle"]
# Async job tracking seam for Phase 4's HTTP endpoints. On by default.
jobs = []
# Postgres store backend (Phase 9). Off by default so wasm32 and non-Postgres
# consumers don't pull sqlx.
postgres = ["sqlx"]
# S3-compatible object storage backend for presigned uploads (Phase 13 Task 4). Off by
# default so wasm32 and non-upload consumers don't pull reqwest/rusty-s3; the browser
# does its own presigned PUT directly, never through this crate.
s3 = ["dep:reqwest", "dep:rusty-s3", "dep:url"]

[dependencies]
aes-siv = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
data-encoding = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
web-time = { workspace = true }
zeroize = { workspace = true }

# Argon2id for API key hashing (Phase 11).
argon2 = { workspace = true }
# Random number generation for API key entropy.
rand = { workspace = true }

# Postgres backend (Phase 9). Gated behind `postgres` feature.
sqlx = { workspace = true, optional = true }

# S3-compatible object storage (Phase 13 Task 4). Gated behind `s3` feature — see the
# `s3` feature comment above and the workspace `Cargo.toml` comments on both crates for
# why `rusty-s3` (pure SigV4 computation) + `reqwest` (the confirm-step HEAD request)
# rather than `aws-sdk-s3`.
reqwest = { workspace = true, optional = true }
rusty-s3 = { workspace = true, optional = true }
url = { workspace = true, optional = true }

# `axum` and `tokio` are native-only: `axum` is the auth middleware's server framework
# (`auth/authz.rs`, gated out of the crate on wasm32 — see `lib.rs`), and `tokio`'s
# `rt-multi-thread`/`fs` features that `store_file.rs` needs don't compile for
# wasm32-unknown-unknown at all. `xberg` is split the same way, mirroring the precedent
# in xberg's own Cargo.toml: the native side keeps `tokio-runtime`.
#
# `uuid` is split too, but for a different reason (Track L3): its `v4` feature needs a
# randomness source, and on wasm32-unknown-unknown that's `uuid`'s own `js` feature — a
# self-contained `wasm-bindgen` binding straight to `globalThis.crypto.getRandomValues`
# (`uuid`'s `rng.rs`), not `getrandom`, so no `--cfg getrandom_backend=...` RUSTFLAGS is
# needed here.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
xberg = { workspace = true }

# wasm32 gets `xberg/wasm-target`'s components individually rather than the umbrella
# feature itself, minus `ocr-wasm`. `ocr-wasm` builds `xberg-tesseract` against a WASI
# SDK C toolchain (`crates/xberg-tesseract/build.rs`, `build_wasm()`) that this repo's
# CI/dev containers don't provision yet — a `WASI_SDK_PATH` environment gap, not a Rust
# problem, and the real published `@xberg-io/xberg-wasm` package does build it once that
# toolchain is present. hacienda-wasm doesn't call extraction/OCR yet (see
# `crates/hacienda-wasm`), so deferring it costs nothing today; add `ocr-wasm` back once
# Track I needs xberg's extraction on wasm32 and WASI SDK is provisioned in CI.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
# TEMPORARY: same jamon8888/xberg patched-commit workaround as the workspace root
# Cargo.toml's `xberg` entry — see that entry's comment for why. Must stay in sync with
# it (same `rev`) or cargo refuses to build with "different source paths depending on
# the build target".
xberg = { git = "https://github.com/jamon8888/xberg.git", rev = "9bfbc10acca5c1648547a4d861153d2f5c363340", default-features = false, features = [
    "no-ort-target",
    "excel-wasm",
    "layout-tract",
    "auto-rotate-tract",
    "ner-candle-wasm",
] }
# `IndexedDbAuditStore` (Track L5, `audit/store_idb.rs`). `send_wrapper`'s "futures"
# feature is not a workaround for a bug — `AuditStore` (like every trait using bare
# `#[async_trait]`) returns `Send`-bounded futures by design, so file/database backends
# can do their I/O off whatever executor thread runs them. `web_sys`/`js_sys` handles
# (the `Database` connection, transactions, requests) are `!Send` unconditionally, on
# every wasm32 target, because `wasm-bindgen` does not special-case the single-threaded
# case. `SendWrapper` is the standard way to satisfy a `Send` bound around JS handles when
# the target is actually single-threaded (`wasm32-unknown-unknown` without the `atomics`
# target feature, which is what this crate builds for) — it just moves the "never
# actually crosses a thread" invariant from the type system to a runtime assertion that
# can never fire here.
indexed_db_futures = { version = "0.6", features = ["serde"] }
send_wrapper = { version = "0.6", features = ["futures"] }

[dev-dependencies]
# `ServiceExt::oneshot`, to drive the auth middleware through a real `Router`. Unit-testing
# the route-matching helper alone cannot catch a middleware that forwards to `next` on the
# path where it should refuse, which is precisely the bug this exercises.
tower = { version = "0.5", features = ["util"] }
# Only for hacienda-core/tests/lora_adapter_contract.rs's empty-directory fixture.
tempfile = { workspace = true }
# Disposable-Postgres fixture for the `postgres` feature's integration tests (Phase 9 Task
# 1 Step 5) — see `store/postgres/test_support.rs`. Only ever compiled for `cargo test`, so
# declaring it unconditionally here (Cargo has no `optional` dev-dependencies) costs
# non-postgres consumers nothing; every call site that touches it is already behind
# `#[cfg(feature = "postgres")]` because it lives under `store/postgres/`, which is itself
# feature-gated (see `store/mod.rs`).
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

# Note: `async-trait` is not repeated here. It used to be a dev-dependency for test doubles
# implementing xberg's async `NerBackend` trait, but the `AuditStore`/`JobStore` traits made
# it a real dependency, and regular dependencies are already available to tests.

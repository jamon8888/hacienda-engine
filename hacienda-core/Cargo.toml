[package]
name = "hacienda-core"
version.workspace = true
edition.workspace = true
description = "PII, compliance, audit, review, and glossary core for hacienda"
license.workspace = true

[features]
default = ["jobs"]
# Enables the Candle GLiNER2 NER backend (with LoRA adapter support) through xberg.
ner-candle = ["xberg/ner-candle"]
# Async job tracking seam for Phase 4's HTTP endpoints. On by default.
jobs = []

[dependencies]
aes-siv = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
data-encoding = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
zeroize = { workspace = true }

# `axum`, `tokio` and `uuid` are native-only: `axum` is the auth middleware's server
# framework (`auth/authz.rs`, gated out of the crate on wasm32 — see `lib.rs`), `tokio`'s
# `rt-multi-thread`/`fs` features that `store_file.rs` needs don't compile for
# wasm32-unknown-unknown at all, and `uuid`'s `v4` feature needs the `js` getrandom
# backend on wasm32 (Track L3), which the workspace dependency doesn't enable yet.
# `xberg` is split the same way, mirroring the precedent in xberg's own Cargo.toml: the
# native side keeps `tokio-runtime`, wasm32 swaps in `wasm-target`. hacienda-core's own
# wasm32 build only reaches `pii`/`redaction`, which use `xberg::text::ner` and
# `xberg::types::entity` — the `ner` feature alone, not the full `wasm-target` umbrella
# (OCR/Excel/layout are facade-only concerns, not yet compiled on wasm32 here).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
xberg = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
xberg = { git = "https://github.com/xberg-io/xberg.git", tag = "v1.0.2", default-features = false, features = [
    "ner",
] }

[dev-dependencies]
# `ServiceExt::oneshot`, to drive the auth middleware through a real `Router`. Unit-testing
# the route-matching helper alone cannot catch a middleware that forwards to `next` on the
# path where it should refuse, which is precisely the bug this exercises.
tower = { version = "0.5", features = ["util"] }

# Note: `async-trait` is not repeated here. It used to be a dev-dependency for test doubles
# implementing xberg's async `NerBackend` trait, but the `AuditStore`/`JobStore` traits made
# it a real dependency, and regular dependencies are already available to tests.

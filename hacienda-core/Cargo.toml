[package]
name = "hacienda-core"
version.workspace = true
edition.workspace = true
description = "PII, compliance, audit, review, and glossary core for hacienda"
license.workspace = true

[features]
default = []
# Enables the Candle GLiNER2 NER backend (with LoRA adapter support) through xberg.
ner-candle = ["xberg/ner-candle"]

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
xberg = { workspace = true }

[dev-dependencies]
# Test doubles implement xberg's async `NerBackend` trait, which is `async_trait`-based.
async-trait = { workspace = true }

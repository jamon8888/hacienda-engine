[files]
extend-exclude = [
  "superpowers/",
  ".ai-rulez/",
  "scripts/",
  "poly.toml",
  # French-language prose. `typos` is an English dictionary, so it reads "moteur" as
  # "motor", "ressources" as "resources", "amont" as "amount" — 91 corrections that would
  # each make the text wrong. Excluded by file rather than by directory so English
  # documents added under docs/architecture/ are still checked. Same reason `superpowers/`
  # is excluded above: it holds the French design specs.
  "docs/architecture/2026-07-31-analyse-architecture-et-pistes-produit.md",
]

[default.extend-words]
hacienda = "hacienda"
xberg = "xberg"
pii = "pii"
cli = "cli"
mcp = "mcp"
fpe = "fpe"
drl = "drl"
# US Employer Identification Number, not a typo for "IN".
ein = "ein"
# hacienda-core/src/auth/authn.rs:476 doc comment; "unparsable" is also correct English but
# not what's written there.
unparseable = "unparseable"
# hacienda-core/tests/config_round_trip.rs: deliberately misspelled config keys/values used to
# assert the parser's error message quotes the bad input verbatim. The misspelling is the
# point of the test, not a typo to fix.
frist = "frist"
reveiw = "reveiw"
cahce = "cahce"

[default.extend-identifiers]

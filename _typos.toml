[files]
# fixtures/ner-eval/ is hand-written French/English NER eval prose (hacienda-core/tests/ner_eval.rs);
# an English spell-checker has nothing useful to say about French sentences.
extend-exclude = ["superpowers/", ".ai-rulez/", "scripts/", "poly.toml", "fixtures/ner-eval/"]

[default.extend-words]
hacienda = "hacienda"
xberg = "xberg"
pii = "pii"
cli = "cli"
mcp = "mcp"
fpe = "fpe"
drl = "drl"
# US Employer Identification Number, not a typo for "IN".
ein = "ein"
# hacienda-core/src/auth/authn.rs:476 doc comment; "unparsable" is also correct English but
# not what's written there.
unparseable = "unparseable"
# hacienda-core/tests/config_round_trip.rs: deliberately misspelled config keys/values used to
# assert the parser's error message quotes the bad input verbatim. The misspelling is the
# point of the test, not a typo to fix.
frist = "frist"
reveiw = "reveiw"
cahce = "cahce"
# hacienda-core/tests/ner_eval.rs doc comment: an example of a typo'd fixture label the
# schema test is designed to catch, not a typo to fix.
loaction = "loaction"

[default.extend-identifiers]

[files]
extend-exclude = [
  "superpowers/",
  ".ai-rulez/",
  "scripts/",
  "poly.toml",
  # fixtures/ner-eval/ is hand-written French/English NER eval prose
  # (hacienda-core/tests/ner_eval.rs); an English spell-checker has nothing useful to say
  # about French sentences.
  "fixtures/ner-eval/",
  # Same reason, for the same language: `typos` reads "moteur" as "motor", "ressources" as
  # "resources", "amont" as "amount" — corrections that would each make the text wrong.
  # `docs/architecture/` is the French architecture corpus (analysis + index); English
  # documents belong at the `docs/` root, where they stay checked. Same reasoning for the
  # two docs/*-ia-fr.md guides.
  "docs/architecture/",
  "docs/hacienda-guide-ia-fr.md",
  "docs/setup-harnais-ia-fr.md",
  # apps/hacienda-studio/components/extend/layout-blocks.tsx embeds verbatim excerpts from
  # academic papers (as page-builder demo content) plus generated block ids —
  # hyphenated line-break artifacts ("transfor- mation"), author-name fragments, and random
  # id substrings read as typos to an English dictionary but are not text anyone here
  # authored or should "fix".
  "apps/hacienda-studio/components/extend/layout-blocks.tsx",
  # apps/hacienda-studio/public/models/ is vendored model assets (GLiNER2 tokenizer
  # vocabulary, etc.) — subword tokens like "fonction"/"schoo"/"opion" are training-data
  # fragments, not English prose, and aren't meant to satisfy a spell-checker any more than
  # a binary would.
  "apps/hacienda-studio/public/models/",
  # crates/hacienda-wasm/pkg/ is wasm-bindgen's own generated JS/TS glue
  # (ci-wasm-freshness.yaml rebuilds and diffs it, so it's trusted as machine output, not
  # hand-authored) — its `__wbg_*_<hash>` export names embed random hex suffixes that
  # occasionally spell real words ("ba", "ede") by coincidence, not typos to fix.
  "crates/hacienda-wasm/pkg/",
  # `.github/skills/` is vendored Claude Code skill reference documentation (e.g.
  # `impeccable`), not this repo's own prose — same category ci-lint.yaml's markdown-lint
  # step already excludes `.agents/skills`/`superpowers`/`.ai-rulez` for. Confirmed failing
  # here specifically (e.g. "UDID" flagged as a typo for "UUID" in an iOS reference doc —
  # UDID is the correct, real term), not a hypothetical.
  ".github/skills/",
  # vendor/candle-{core,transformers}-0.11.0-wasm-fix/ are the upstream crates.io sources
  # for two wasm32 bugfix patches (see root Cargo.toml's `[patch.crates-io]`), copied
  # verbatim aside from the specific patched lines — third-party ML library source, not
  # this repo's prose, same "machine/vendored output" category as
  # `crates/hacienda-wasm/pkg/` above. Confirmed failing here specifically: numpy/tensor
  # API names like "arange", ML jargon like "mmaped"/"layrnorm", not real typos.
  "vendor/candle-core-0.11.0-wasm-fix/",
  "vendor/candle-transformers-0.11.0-wasm-fix/",
  # vendor/xberg-wasm-ner-fix/pkg/web/ is a locally-built @xberg-io/xberg-wasm binary plus
  # wasm-bindgen's own generated JS/TS glue around it — same "machine output, not
  # hand-authored" category as crates/hacienda-wasm/pkg/ above.
  "vendor/xberg-wasm-ner-fix/",
]

[default.extend-words]
hacienda = "hacienda"
xberg = "xberg"
pii = "pii"
cli = "cli"
mcp = "mcp"
fpe = "fpe"
drl = "drl"
# US Employer Identification Number, not a typo for "IN".
ein = "ein"
# hacienda-core/src/auth/authn.rs:476 doc comment; "unparsable" is also correct English but
# not what's written there.
unparseable = "unparseable"
# hacienda-core/tests/config_round_trip.rs: deliberately misspelled config keys/values used to
# assert the parser's error message quotes the bad input verbatim. The misspelling is the
# point of the test, not a typo to fix.
frist = "frist"
reveiw = "reveiw"
cahce = "cahce"
# hacienda-core/tests/ner_eval.rs doc comment: an example of a typo'd fixture label the
# schema test is designed to catch, not a typo to fix.
loaction = "loaction"
# The "mis-" prefix in "mis-scoring"/"mis-counting" (hacienda-core, crates/hacienda-rag,
# CHANGELOG.md) reads as a truncated "miss"/"mist" to the checker; it is not one.
mis = "mis"
# French UI copy in apps/hacienda-studio/{App,pages/Assets,pages/Landing,pages/Settings}.tsx
# (the interface was translated to French) — same false-positive class the
# docs/architecture/ exclusion above already documents ("ressources" read as "resources",
# "sur" as "sure"), just as scattered words in .tsx files rather than whole doc files, so a
# word-level allowlist fits better than excluding those files (which also have real English
# code around the French strings that should stay checked).
ressources = "ressources"
sur = "sur"
appareil = "appareil"
espace = "espace"
convertis = "convertis"

[default.extend-identifiers]
